---
# CI: secret scanning and ansible-vault encryption guard.
name: Security

on:
  # `push` is restricted to main, `pull_request` covers everything else.
  # Without the branches filter BOTH fire for a push to a branch with an open
  # PR, so every job ran twice and every job is billed rounded UP to a full
  # minute — duplication is the expensive kind of waste here, not slowness.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"   # weekly bit-rot check (Mon 06:15 UTC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists PR commits on pull_request events
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vault-guard:
    name: vault-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Ensure vault files are encrypted
        run: |
          set -euo pipefail
          files=$(git ls-files '*vault*.yml' || true)
          if [ -z "$files" ]; then
            echo "No vault files committed — nothing to check."
            exit 0
          fi
          fail=0
          for f in $files; do
            # The single-quoted $ANSIBLE_VAULT below is a literal grep pattern, not a shell expansion.
            # shellcheck disable=SC2016
            if head -1 "$f" | grep -q '^\$ANSIBLE_VAULT'; then
              echo "OK (encrypted): $f"
            else
              echo "::error file=$f::not encrypted with ansible-vault"
              fail=1
            fi
          done
          exit "$fail"
