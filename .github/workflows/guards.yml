---
# CI: mechanical checks for the CLAUDE.md rules that ansible-lint cannot
# express (§13 — a rule belongs in CI when a check for it is expressible).
#
# Deliberately has NO paths-ignore: several guards are ABOUT documentation
# (README pairing, index completeness, skill-mirror sync, §N references), so
# filtering out doc-only changes would put the guard to sleep exactly when it
# is needed. The whole job is grep/sed and finishes in seconds.
name: Guards

on:
  # `push` is restricted to main, `pull_request` covers everything else.
  # Without the branches filter BOTH fire for a push to a branch with an open
  # PR, so every job ran twice and every job is billed rounded UP to a full
  # minute — duplication is the expensive kind of waste here, not slowness.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"   # weekly bit-rot check (Mon 06:30 UTC)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-guards:
    name: spec-guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run the spec guards
        run: bash .github/scripts/spec-guards.sh

      # Wired once the inventory moved to its private repository (#68), at
      # which point the guard went from 9 findings to zero. From here on it is
      # what stops an address or a domain creeping back in — the repository is
      # meant to become public, and a tell added later would be published
      # silently.
      - name: Run the de-identification guard
        run: bash .github/scripts/tells-guard.sh
