[defaults]
# The inventory lives in a SEPARATE PRIVATE REPOSITORY (#68): host addresses,
# mesh addresses, service domains and SSH public keys identify specific
# machines, and this repository is meant to be publishable. Clone it beside
# this checkout for local runs. Semaphore passes -i explicitly and does not
# depend on this line. Every group_vars/... path in the comments throughout
# this repository is relative to that inventory, not to here.
inventory          = ../infra-inventory/hosts.yml
roles_path         = roles
collections_path   = ~/.ansible/collections
# Silence the per-host "discovered Python interpreter" warning; auto-detection
# behaviour is unchanged.
interpreter_python = auto_silent
# Disabled to allow first-contact login to freshly provisioned VPS (new_vps)
# whose host keys are not yet known. Re-evaluate once hosts are bootstrapped.
host_key_checking  = False
retry_files_enabled = False
# Default is 5, which happened to equal the size of the `managed` group. One
# node past that and the extra host runs in a SECOND batch, doubling the wall
# time of every fleet play with nothing in the log to say why. Raised ahead of
# the growth; a play against one host is unaffected.
forks              = 10
# Use the built-in default callback with YAML-formatted results instead of the
# community.general "yaml" callback, which is incompatible across some
# ansible-core versions.
stdout_callback    = default
result_format      = yaml
# Print a per-task duration and a slowest-tasks summary at the end of every run.
# Provisioning takes about twenty minutes and nobody has ever measured WHERE it
# goes — the guesses (a kernel installed and then replaced, four full apt
# refreshes) are plausible and unverified, which is exactly the state this
# repository keeps getting burned by. Costs nothing but output.
callbacks_enabled  = ansible.posix.profile_tasks

[privilege_escalation]
become       = False
become_method = sudo

[ssh_connection]
pipelining   = True
# ControlPersist raised from 60s: provisioning has tasks that run for minutes
# (apt full-upgrade, kernel install), so a one-minute master connection expired
# during almost every one of them and the next task paid for a fresh handshake.
ssh_args     = -o ControlMaster=auto -o ControlPersist=10m
