---
# Example inventory — the group layout the playbooks and roles expect.
#
# The real inventory (host names, group_vars, host_vars) lives in a SEPARATE
# PRIVATE repository; Semaphore already clones it independently of this one.
# This file exists so the public repository still documents the structure the
# code depends on.
#
# NO ADDRESSES — here or in the real inventory (CLAUDE.md §7). Hosts are reached
# by mesh name: the inventory name is the NetBird peer name, so the address is
# derived, not stored. Public addresses live only in OpenBao (infra/hosts),
# where provision-node.yml records a finished node and checks new requests.
all:
  children:
    # Freshly rented servers PENDING bootstrap: a host lives here only until
    # playbooks/site.yml has run, then moves to "managed" (or "lab") and is
    # removed from this group. Normally empty; provision-node.yml also joins
    # its in-memory target here to inherit these vars.
    new_vps:
      hosts: {}
      vars:
        ansible_user: root

    # Bootstrapped hosts under daily management (upgrade + Telegram report).
    managed:
      hosts:
        node-a:
        node-b:
        # The control server itself, also over the mesh: from inside the
        # Semaphore container "localhost" would be the container. Its peer name
        # need not match the inventory name, and it is reached on 22, so both
        # are stated rather than inherited from fleet.
        panel:
          ansible_host: "panel-peer.{{ netbird_dns_domain }}"
          ansible_port: 22
      vars:
        ansible_user: ansible

    # Experimental/disposable hosts (provision.yml target). Not in "managed":
    # no daily updates or Telegram reporting.
    lab:
      hosts:
        test:
      vars:
        ansible_user: ansible

    # Parent group: every host Dockhand can reach (managed fleet + lab
    # experiments). Holds the Hawser vars (group_vars/fleet/) and the mesh
    # addressing every member inherits.
    fleet:
      children:
        managed:
        lab:
      vars:
        ansible_host: "{{ inventory_hostname }}.{{ netbird_dns_domain }}"
        # Mesh :22 belongs to NetBird SSH on peers that enable it, so automation
        # uses the port roles/ssh_hardening opens on the mesh interface.
        ansible_port: "{{ automation_ssh_port }}"
        # NetBird DNS answers AAAA as well, and the Semaphore container has no
        # IPv6 route — without this, ssh dies with "Network unreachable".
        #
        # ServerAlive*: a peer that reboots faster than its old TCP connection
        # is reset leaves Ansible's multiplexed ssh master on a dead link, and
        # ansible-core's default ssh_args carry no keepalive. The master then
        # waits out the kernel's retransmissions — tens of minutes — and
        # ansible.builtin.reboot blocks inside one boot-id check, past its own
        # timeout (de-1, update run #436). With keepalives the master gives up
        # in ~30 s, ssh exits 255, and a retry opens a fresh connection.
        ansible_ssh_common_args: "-o AddressFamily=inet -o ServerAliveInterval=10 -o ServerAliveCountMax=3"

    control:
      hosts:
        controller:
          ansible_connection: local
