---
# Take a snapshot of OpenBao and send it out of the panel (#7).
#
# WHY A SNAPSHOT AND NOT A COPY OF THE DATA DIRECTORY. Storage is integrated
# Raft, which is BoltDB: a live file the server holds open and writes to. A
# file-level copy is taken mid-transaction and restores as a torn database —
# and you find that out during a restore, which is the worst moment to find
# anything out. sys/storage/raft/snapshot is the consistent point-in-time
# image, taken online, with no pause.
#
# WHY SENDING IT TO A CHAT IS NOT RECKLESS. The snapshot is sealed with the
# barrier key. What leaves here is ciphertext, and restoring it needs the
# unseal shares — which live in a password manager and never touch this fleet.
# That is also the whole risk, stated plainly:
#
#   THE ARCHIVE ACCUMULATES AND IS NOT ROTATED. Every snapshot stays in that
#   chat forever. If the unseal shares ever leak, the entire history becomes
#   readable at once — including secrets rotated long ago. A destination with
#   retention would bound that; this one does not, and it was chosen knowing so.
#
# WHAT THIS PLAYBOOK CANNOT DO IS PROVE THE BACKUP WORKS. A file arriving in a
# chat is evidence of an upload, not of a restore. The drill is manual, needs
# the unseal shares, and is written up in roles/openbao/README.md. Perform it,
# or this is a habit rather than a backup.
#
# Runs from Semaphore on a schedule. The snapshot is written inside the
# Semaphore container, uploaded, and removed — it is never left on the panel.
#
# From the panel CLI instead:
#
#   cd /opt/ansible-playbooks
#   ansible-playbook -c local playbooks/openbao-backup.yml \
#     -e openbao_addr=http://127.0.0.1:8200

- name: Back up OpenBao
  hosts: controller
  # No facts needed: the only thing this play wanted from them was a timestamp,
  # and now(utc=true) gives a better one — see _backup_stamp.
  gather_facts: false

  vars:
    # Bounded by the DOWNLOAD side, not the upload side. A bot may send a larger
    # document than it can fetch back, and this playbook fetches it back to
    # prove what arrived — a backup that cannot be verified is worth less than
    # one that can, so the smaller of the two limits is the one that governs.
    # The size is reported on every run so the trend is visible long before it
    # matters. Today the store is a handful of KV secrets, two SSH roles and
    # some policies, around 70 KB.
    openbao_backup_max_mb: 20

    # Derived from a FACT set in pre_tasks, never from now() directly. A play
    # var holding {{ now(...) }} is re-evaluated at every reference, so the path
    # changed between writing the snapshot and uploading it — the file was
    # written as ...T072453 and looked for as ...T072454. ansible_date_time did
    # not have that problem because a fact is computed once; now() is a
    # function. Measured on task #330.
    #
    # default() so the always-block below can still run if the play failed
    # before pre_tasks got there; removing a path that does not exist is fine.
    _backup_path: "/tmp/openbao-{{ _backup_stamp | default('unknown') }}.snap"

  # Before the block, so the timestamp exists for the cleanup in `always` even
  # if the very first task fails.
  #
  # UTC on purpose. ansible_date_time would also be stable, but it is LOCAL time
  # and a top-level fact that INJECT_FACTS_AS_VARS deprecates; the panel, the
  # nodes and the operator do not share a timezone, and a backup's name should
  # read the same for all three.
  pre_tasks:
    - name: Fix the timestamp for this run
      ansible.builtin.set_fact:
        _backup_stamp: "{{ now(utc=true, fmt='%Y%m%dT%H%M%S') }}"
      tags:
        - config

  tasks:
    - name: Back it up and ship it
      block:
        # Reading a secret is also how the AppRole login happens, and this run
        # needs both halves: the bot token to send with, and the token's
        # snapshot-read capability to fetch with.
        - name: Fetch the Telegram credentials
          ansible.builtin.include_tasks: tasks/openbao-read.yml
          vars:
            openbao_read_path: telegram
            openbao_read_into: _telegram
          tags:
            - config

        - name: Ask OpenBao which version is about to be snapshotted
          ansible.builtin.uri:
            url: "{{ openbao_addr }}/v1/sys/health"
            method: GET
            status_code: [200, 429, 472, 473, 501, 503]
          register: _bao_health
          changed_when: false
          check_mode: false
          tags:
            - config

        # The response body IS the snapshot, so it goes straight to a file.
        - name: Take the snapshot
          ansible.builtin.uri:
            url: "{{ openbao_addr }}/v1/sys/storage/raft/snapshot"
            method: GET
            headers:
              X-Vault-Token: "{{ _openbao_token }}"
            dest: "{{ _backup_path }}"
            status_code: [200]
          register: _snapshot
          # Reading state changes nothing in the store. The change is the file,
          # and the file is deleted before this play ends.
          changed_when: false
          no_log: true
          tags:
            - config

        - name: Measure it
          ansible.builtin.stat:
            path: "{{ _backup_path }}"
          register: _snapshot_stat
          tags:
            - config

        # Fails BEFORE the upload rather than letting Telegram reject it with an
        # error that says nothing about why. An empty file is the more alarming
        # case of the two: it means the snapshot endpoint answered 200 with
        # nothing, and a zero-byte backup that uploads cleanly is exactly the
        # kind of success nobody questions.
        - name: Assert the snapshot is neither empty nor too large to send
          ansible.builtin.assert:
            that:
              - _snapshot_stat.stat.size > 0
              - _snapshot_stat.stat.size < (openbao_backup_max_mb | int * 1024 * 1024)
            fail_msg: >-
              The snapshot is {{ _snapshot_stat.stat.size }} bytes. Zero means
              the endpoint returned nothing and there is no backup — check that
              the AppRole token carries the snapshot-read policy. Larger than
              {{ openbao_backup_max_mb }} MB means this destination has been
              outgrown and the snapshot needs somewhere with real retention;
              see the header of this file for why that was a known limit.
          tags:
            - config

        # A snapshot is a gzip-compressed tar of exactly three members, per
        # internal/physical/raft/snapshot/archive.go upstream:
        #
        #   meta.json   - JSON-encoded snapshot metadata from Raft
        #   state.bin   - Encoded snapshot data from Raft
        #   SHA256SUMS  - SHA-256 sums of the above two files
        #
        # Which means the format carries its own integrity check, and using it
        # costs nothing on a file this size. `size > 0` would happily pass a
        # truncated download; this will not.
        #
        # It still proves NOTHING about restorability — state.bin is sealed with
        # the barrier and only a real restore exercises that. This says the
        # artifact is intact, not that it works.
        - name: Verify the snapshot is an intact archive
          ansible.builtin.shell:
            cmd: |
              d=$(mktemp -d) || exit 1
              trap 'rm -rf "$d"' EXIT
              tar -xzf {{ _backup_path | quote }} -C "$d" 2>/dev/null || { echo NOT_A_GZIP_TAR; exit 0; }
              for f in meta.json state.bin SHA256SUMS; do
                [ -f "$d/$f" ] || { echo "MISSING:$f"; exit 0; }
              done
              cd "$d" && sha256sum -c SHA256SUMS >/dev/null 2>&1 || { echo CHECKSUM_MISMATCH; exit 0; }
              echo INTACT
            executable: /bin/sh
          register: _snapshot_verify
          changed_when: false
          # The script exits 0 whatever it finds and says so on stdout, so the
          # verdict is this condition rather than a shell status that could also
          # mean "tar is missing from the image".
          failed_when: (_snapshot_verify.stdout | trim) != 'INTACT'
          tags:
            - config

        # NOT ansible.builtin.uri with form-multipart. At ansible-core 2.20.8 a
        # file part is base64-encoded and there is no way to turn that off:
        #
        #   multipart_encoding_str = value.get('multipart_encoding') or 'base64'
        #   encoders_dict = {"base64": ..., "7or8bit": ...}
        #
        # Telegram stores what it receives, so every snapshot sent that way was
        # base64 TEXT of a snapshot — an archive that passed the local integrity
        # check, uploaded cleanly, reported success, and would have failed at
        # `gzip: invalid header` on the day it was needed. Found by the restore
        # drill on 2026-08-22, not by any green run.
        #
        # Newer ansible-core can send a part unencoded; ours cannot, and a
        # backup should not depend on which one the container happens to carry.
        #
        # AND THEN IT READS THE FILE BACK. The local artifact being intact says
        # nothing about what arrived — that was precisely the blind spot. This
        # downloads the stored document and compares SHA-256 with what was sent.
        #
        # The script exits 0 whatever happens and reports a verdict on stdout,
        # so failed_when distinguishes one failure from another — a missing curl
        # and a corrupted round trip need different responses.
        #
        # No pipes anywhere, deliberately: each step writes a file and the next
        # one reads it. That is not style. `set -o pipefail` is what a pipeline
        # here would need, and whether busybox ash honours it is a question this
        # playbook should not have to answer correctly in order for backups to
        # work.
        - name: Send it to Telegram and read it back
          ansible.builtin.shell:
            cmd: |
              command -v curl >/dev/null 2>&1 || { echo NO_CURL; exit 0; }
              api="https://api.telegram.org/bot$BOT_TOKEN"
              t=$(mktemp -d) || exit 1
              trap 'rm -rf "$t"' EXIT
              curl -sS -X POST "$api/sendDocument" -o "$t/sent.json" \
                   -F "chat_id=$CHAT_ID" \
                   ${TOPIC_ID:+-F "message_thread_id=$TOPIC_ID"} \
                   -F "caption=$CAPTION" \
                   -F "document=@$SNAP;type=application/octet-stream" \
                || { echo UPLOAD_FAILED; exit 0; }
              fid=$(python3 -c 'import sys,json;d=json.load(open(sys.argv[1]));print(d["result"]["document"]["file_id"] if d.get("ok") else "")' "$t/sent.json" 2>/dev/null)
              [ -n "$fid" ] || { echo UPLOAD_REJECTED; exit 0; }
              curl -sS -o "$t/file.json" "$api/getFile?file_id=$fid" || { echo GETFILE_FAILED; exit 0; }
              fpath=$(python3 -c 'import sys,json;d=json.load(open(sys.argv[1]));print(d["result"]["file_path"] if d.get("ok") else "")' "$t/file.json" 2>/dev/null)
              [ -n "$fpath" ] || { echo NO_FILE_PATH; exit 0; }
              curl -sS -o "$t/back.bin" "https://api.telegram.org/file/bot$BOT_TOKEN/$fpath" \
                || { echo DOWNLOAD_FAILED; exit 0; }
              sent=$(sha256sum "$SNAP"); sent=${sent%% *}
              got=$(sha256sum "$t/back.bin"); got=${got%% *}
              [ "$sent" = "$got" ] || { echo "MISMATCH sent=$sent got=$got"; exit 0; }
              echo ROUNDTRIP_OK
            executable: /bin/sh
          environment:
            BOT_TOKEN: "{{ _telegram.bot_token }}"
            CHAT_ID: "{{ _telegram.chat_id | string }}"
            TOPIC_ID: >-
              {{ _telegram.backup_topic_id
                 | default(_telegram.updates_topic_id | default(''), true) | string }}
            CAPTION: "{{ _backup_caption }}"
            SNAP: "{{ _backup_path }}"
          vars:
            # The version is not decoration: a snapshot taken by a newer
            # OpenBao may not restore into an older one, and six months from
            # now this line is what says which image to bring up.
            _backup_caption: >-
              OpenBao snapshot {{ _backup_stamp }} ·
              {{ (_snapshot_stat.stat.size / 1024 / 1024) | round(2) }} MB ·
              v{{ _bao_health.json.version | default('?') }}
          register: _telegram_send
          changed_when: (_telegram_send.stdout | trim) == 'ROUNDTRIP_OK'
          failed_when: (_telegram_send.stdout | trim) != 'ROUNDTRIP_OK'
          no_log: true
          tags:
            - config

        - name: Report what left the panel
          ansible.builtin.debug:
            msg: >-
              Snapshot {{ _backup_stamp }} sent and read back byte-identical —
              {{ (_snapshot_stat.stat.size / 1024 / 1024) | round(2) }} MB from
              OpenBao v{{ _bao_health.json.version | default('?') }}.
              That is delivery, NOT restorability. The drill is in
              roles/openbao/README.md and needs the unseal shares.
          tags:
            - debug
            - config

      # The snapshot is the whole store in one file. It does not get to survive
      # a failure in the middle of this play.
      always:
        - name: Remove the local copy
          ansible.builtin.file:
            path: "{{ _backup_path }}"
            state: absent
          tags:
            - config
