---
# Deploy the Hawser edge agent on remote managed hosts.
#
# Per-host tokens live in OpenBao (#2) as ONE secret whose fields are inventory
# hostnames, which is the shape the per-host table has always had:
#
#   infra/hawser   fi=<token>  de=<token>  kz=<token>  ru=<token>
#
# `bao kv put` REPLACES a secret wholesale, so adding a node means writing the
# whole table again, not appending a field. The recipe for that — building the
# JSON without the values touching the screen — is in
# roles/openbao/README.md.
#
# Hosts with no field in the table (the control node, managed locally over the
# Docker socket) get an empty token and are skipped.
#
# The Dockhand endpoint is a plain inventory variable, not a secret:
# hawser_dockhand_url in group_vars/all.
#
# The template needs the Variable Group carrying OPENBAO_SECRET_ID attached.

# Read on the controller, in its own play, because the table serves every host
# and the target hosts cannot reach OpenBao at all — its API is on a Docker
# network the panel owns, not on the mesh.
- name: Fetch the Hawser token table
  hosts: controller
  gather_facts: false

  tasks:
    # No openbao_read_field: this secret IS the table, and the whole thing is
    # wanted rather than one value out of it.
    - name: Fetch the per-host Hawser tokens
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: hawser
        openbao_read_into: _hawser_tokens
      tags:
        - config

    # The first playbook to connect with a certificate rather than with the key
    # alone. Deliberately this one: it auto-runs on every merge to main against
    # the lab node, so the path gets exercised constantly and fails where it
    # costs nothing.
    #
    # The key is STILL in authorized_keys, so a broken certificate path is
    # invisible in the run — ssh simply falls back. Proving it works therefore
    # means reading the node's auth log for the serial, not reading a green
    # recap. Removing the key is what makes this loud, and that is a later,
    # deliberate step.
    - name: Get a certificate for this run
      ansible.builtin.include_tasks: tasks/ssh-cert.yml
      tags:
        - config

- name: Deploy Hawser edge agents
  hosts: fleet
  become: true
  gather_facts: true

  vars:
    ansible_user: "{{ bootstrap_user }}"
    # Present the certificate signed above. Unconditional on purpose: an empty
    # path would make ssh refuse the option outright, which is the loud failure
    # wanted here. The pre_tasks guard below already covers the one way it can
    # legitimately be absent — a limit that excluded the controller.
    ansible_ssh_common_args: >-
      -o CertificateFile={{ hostvars['controller']._fleet_ssh_cert_path | default('') }}
    # From OpenBao, read by the play above. group_vars defines nothing here; the
    # resolve to the same value; this one comes from OpenBao.
    hawser_token: >-
      {{ (hostvars['controller']._hawser_tokens | default({}))[inventory_hostname]
         | default('') }}

  # `--limit` filters EVERY play, the token-table play above included. When it
  # is excluded the table is never read, `hawser_token` resolves to '' for each
  # host through the default() above, the deploy skips itself, and the run ends
  # ok=1 changed=0 failed=0 — a green run that did nothing. Measured on pl-1,
  # task #256. The rotation recipe in dockhand-environment.yml would have hit
  # exactly this: a node left holding a revoked token, reported as success.
  pre_tasks:
    - name: Assert the token table was read
      ansible.builtin.assert:
        that:
          - hostvars['controller']._hawser_tokens is defined
          - hostvars['controller']._fleet_ssh_cert_path is defined
        fail_msg: >-
          The token table play matched no hosts, so every token here is empty
          and every deploy below would skip silently. A limit that leaves out
          the controller looks exactly like this. Re-run with the controller
          in the limit:
          '{{ ansible_limit | default('<hosts>') }},controller'.
      run_once: true
      tags:
        - config

  tasks:
    - name: Deploy Hawser on hosts with a token configured
      ansible.builtin.include_role:
        name: hawser
      when: hawser_token | default('') | length > 0

    # The skip above is otherwise invisible: a host with no token looks the
    # same in the recap as a host that was never meant to have one.
    - name: Report a host the table has no token for
      ansible.builtin.debug:
        msg: >-
          infra/hawser has no entry for {{ inventory_hostname }}, so Hawser was
          not deployed here. Nodes are given a token by
          dockhand-environment.yml (-e node_name={{ inventory_hostname }}); the
          control node has none by design — Dockhand manages it over the local
          Docker socket.
      when: hawser_token | default('') | length == 0
      tags:
        - debug
        - config
