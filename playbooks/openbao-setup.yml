---
# Create the OpenBao structure: KV v2 at infra/, a read-only policy, and the
# AppRole that Semaphore will authenticate with (issue #2, phase 1).
#
# RUN IT FROM THE PANEL CLI, WITH A SHORT-LIVED BOOTSTRAP TOKEN — never with
# the root token, and never with either stored in Semaphore. The root token
# carries `policies ["root"]` and does not expire: it reads every secret,
# rewrites every policy and can seal the store. A Semaphore Variable Group is
# the wrong home for it, because anyone who can create a task there can print
# an environment variable.
#
# Mint the bootstrap token first (as the operator, holding root):
#
#   docker exec -i openbao bao policy write openbao-bootstrap - <<'EOF'
#   path "sys/mounts"                          { capabilities = ["read", "list"] }
#   path "sys/mounts/infra"                    { capabilities = ["create", "update", "read"] }
#   path "sys/policies/acl/infra-read"         { capabilities = ["create", "update", "read"] }
#   path "sys/policies/acl/hawser-write"       { capabilities = ["create", "update", "read"] }
#   path "sys/policies/acl/ssh-sign"           { capabilities = ["create", "update", "read"] }
#   path "sys/policies/acl/snapshot-read"      { capabilities = ["create", "update", "read"] }
#   path "sys/policies/acl/ssh-sign-operator"  { capabilities = ["create", "update", "read"] }
#   path "sys/auth"                            { capabilities = ["read", "list"] }
#   path "sys/auth/approle"                    { capabilities = ["create", "update", "read", "sudo"] }
#   path "auth/approle/role/semaphore"         { capabilities = ["create", "update", "read"] }
#   path "auth/approle/role/semaphore/role-id" { capabilities = ["read"] }
#   path "sys/auth/userpass"                   { capabilities = ["create", "update", "read", "sudo"] }
#   path "auth/userpass/users/operator"        { capabilities = ["create", "update", "read"] }
#   EOF
#
# Capture the token into the variable rather than printing it — `-field=token`
# on a terminal puts a live credential on screen and into scrollback:
#
#   cd /opt/ansible-playbooks
#   BAO_TOKEN=$(docker exec openbao bao token create #     -policy=openbao-bootstrap -ttl=30m -field=token) && export BAO_TOKEN
#   ansible-playbook -c local playbooks/openbao-setup.yml
#
# -c local because the target is this machine and the panel shell holds no key
# for the mesh address the inventory carries.
# Rewrite the policy above whenever a path is added to it — the comment grants
# nothing, and a stale policy fails with 403 halfway through a run.
#
# That token can build the structure and CANNOT READ A SINGLE SECRET — there is
# no read capability on infra/data/* in the policy above. Leaked, it is worth
# thirty minutes of structural changes rather than every credential forever.
#
# Then, on the panel:
#
#   read -rs BAO_TOKEN && export BAO_TOKEN
#   ansible-playbook playbooks/openbao-setup.yml -e ansible_connection=local
#   unset BAO_TOKEN
#
# `-e ansible_connection=local` is REQUIRED from the panel CLI. The play targets
# `panel`, which carries an ansible_host and ansible_user in the inventory, so
# without it Ansible SSHes from the panel to itself as the `ansible` user — and
# the operator's shell does not hold that key. Running from Semaphore does need
# the SSH hop, so the override belongs on the command line, not in the play.
#
# `read -rs` does not echo and keeps the value out of shell history. The token
# lives in one shell, dies with it, and expires regardless.
#
# The play targets `panel` so the uri tasks execute THERE and reach OpenBao on
# loopback — identical whether Ansible was invoked from the panel CLI or from
# Semaphore. The token is read by a lookup, which runs on the controller.
#
# WHAT THIS PLAYBOOK DELIBERATELY DOES NOT DO:
#   - generate the AppRole secret_id (it is a secret; printing it here would put
#     it in a log). The final task prints the wrapped-delivery command instead.
#   - write any secret VALUES into KV. The operator copies those in.

- name: Create the OpenBao structure and the Semaphore AppRole
  hosts: "{{ openbao_setup_target | default('panel') }}"
  become: false
  gather_facts: false

  vars:
    openbao_api: "http://127.0.0.1:8200"
    openbao_kv_mount: infra
    openbao_policy_name: infra-read
    openbao_write_policy_name: hawser-write
    openbao_ssh_policy_name: ssh-sign
    openbao_snapshot_policy_name: snapshot-read
    openbao_operator_policy_name: ssh-sign-operator
    openbao_approle_name: semaphore
    # The human who signs certificates from a laptop. Overridable so the
    # account is named after a person rather than a role.
    openbao_operator_username: operator

    # Read-only, and scoped to the KV mount only. KV v2 serves reads from
    # <mount>/data/<path>; metadata is separate and needed for listing.
    openbao_policy_hcl: |
      path "{{ openbao_kv_mount }}/data/*" {
        capabilities = ["read"]
      }
      path "{{ openbao_kv_mount }}/metadata/*" {
        capabilities = ["read", "list"]
      }

    # The one place the controller may WRITE, and it is a single exact path —
    # no wildcard, so a mistake cannot reach another secret. Provisioning a node
    # mints its Hawser token and has to persist it, or the next run would mint a
    # different one and reconfigure the agent on every pass (#43-adjacent, and
    # the same always-changed defect fixed in #122).
    #
    # `read` MUST be listed here even though infra-read already grants it on
    # infra/data/*. Policies are not simply additive:
    #
    #   "If the same pattern appears in multiple policies, we take the union of
    #    the capabilities. If different patterns appear in the applicable
    #    policies, we take only the highest-priority match from those policies."
    #
    # An exact path outranks a glob, so this rule REPLACES infra-read's for
    # infra/data/hawser rather than adding to it. Omitting `read` here therefore
    # revoked read access to the hawser table the moment this policy was applied
    # — every other secret kept working, because their paths match only the
    # glob. Cost one failed provisioning run to learn.
    #
    # Writing this path REPLACES the whole secret — KV v2 has no per-field
    # write — so whatever holds this capability must read the map, merge its own
    # host in, and write the result back. The table is keyed by inventory
    # hostname and shared by the entire fleet; a careless write drops every
    # other node's token. That read-merge-write is also why `read` belongs here
    # on its own merits, not only because of the precedence rule.
    openbao_write_policy_hcl: |
      path "{{ openbao_kv_mount }}/data/hawser" {
        capabilities = ["create", "update", "read"]
      }

    # Permission to ASK for a certificate, and nothing else: no read of the CA,
    # no ability to change the role, no other path under the ssh mount. The
    # controller signs with this; whoever holds the AppRole can obtain a
    # 30-minute certificate for the fleet and cannot alter what that means.
    #
    # A different mount from infra/, so the precedence trap above does not apply
    # here — nothing else in any policy matches this path.
    # Two roles, two lines, and no wildcard. `ssh/sign/*` would have covered
    # both and would also cover whatever role is added next, sight unseen — the
    # difference between a policy that grants what it names and one that grants
    # what it happens to match.
    #
    # fleet mints USER certificates, 30 minutes, for logging in. hosts mints
    # HOST certificates, months, proving a node is itself. Separate roles
    # because a single role carries one TTL, and those two numbers are three
    # orders of magnitude apart.
    openbao_ssh_policy_hcl: |
      path "ssh/sign/fleet" {
        capabilities = ["create", "update"]
      }
      path "ssh/sign/hosts" {
        capabilities = ["create", "update"]
      }

    # One capability, and it is not a smaller version of infra-read — it is a
    # different thing. A raft snapshot carries what the KV policy can already
    # read AND what it cannot: the policies themselves, the auth configuration,
    # and the SSH CA's private key, which no API exposes at all.
    #
    # It is all sealed with the barrier, so the file is useless without the
    # unseal shares. That is what makes shipping it off the panel acceptable —
    # and what makes the shares, kept in a password manager, the thing whose
    # loss is unrecoverable.
    openbao_snapshot_policy_hcl: |
      path "sys/storage/raft/snapshot" {
        capabilities = ["read"]
      }

    # The laptop's policy, and deliberately NOT ssh-sign: that one also mints
    # host certificates, which a person never needs. This grants the single
    # call behind `ssh <node>` and nothing else — no secret is readable with
    # it, so it is safe to hold on a machine that leaves the house.
    #
    # It exists to be attached to a userpass account rather than an AppRole.
    # The reason is the certificate's Key ID: it is built from
    # token_display_name, which is the literal string "approle" for every
    # AppRole login, so a node's auth log records that SOMETHING signed in and
    # not who. With userpass the same line names the account. That is not an
    # audit device (#165 stays open) — it is one identity recovered in the one
    # place a node keeps a record of its own accord.
    openbao_operator_policy_hcl: |
      path "ssh/sign/fleet" {
        capabilities = ["create", "update"]
      }

    # The lookup runs on the CONTROLLER, so this picks up the operator's shell.
    _bao_token: "{{ lookup('env', 'BAO_TOKEN') }}"
    _api_headers:
      X-Vault-Token: "{{ _bao_token }}"

  tasks:
    - name: Assert a bootstrap token was supplied
      ansible.builtin.assert:
        that:
          - _bao_token | length > 0
        fail_msg: >-
          BAO_TOKEN is empty. Mint a short-lived bootstrap token (see the header
          of this file) and export it: `read -rs BAO_TOKEN && export BAO_TOKEN`.
          Do not use the root token, and do not store either in Semaphore.
      tags:
        - config

    # No no_log on the read-only GETs: the token travels in a header, which uri
    # does not log, and the responses carry no secrets. Censoring them once made
    # a wrong id undebuggable (#52).
    - name: Fetch the enabled secret engines
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/mounts"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _mounts
      check_mode: false
      tags:
        - config

    # sys/mounts answers with the mounts both at the top level and under .data;
    # .data is the documented shape, so prefer it and fall back.
    #
    # Each guard is computed once and used by BOTH `when` and `changed_when`, so
    # the change report is a real comparison against fetched state rather than a
    # blanket `changed_when: true` (CLAUDE.md §6).
    - name: Determine whether the KV mount is missing
      ansible.builtin.set_fact:
        _need_mount: >-
          {{ (openbao_kv_mount + '/')
             not in (_mounts.json.data | default(_mounts.json, true)).keys() | list }}
      tags:
        - config

    - name: Enable KV v2 at the infra mount
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/mounts/{{ openbao_kv_mount }}"
        method: POST
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          type: kv
          options:
            version: "2"
        status_code: [200, 204]
      no_log: true
      changed_when: _need_mount | bool
      when: _need_mount | bool
      tags:
        - config

    - name: Fetch the existing policy, if any
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_policy_name }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200, 404]
      register: _policy
      check_mode: false
      tags:
        - config

    - name: Determine whether the policy needs writing
      ansible.builtin.set_fact:
        _need_policy: >-
          {{ _policy.status == 404
             or (_policy.json.data.policy | default('')) != openbao_policy_hcl }}
      tags:
        - config

    - name: Write the read-only policy
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_policy_name }}"
        method: PUT
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          policy: "{{ openbao_policy_hcl }}"
        status_code: [200, 204]
      no_log: true
      changed_when: _need_policy | bool
      when: _need_policy | bool
      tags:
        - config

    # A second, narrow policy rather than widening infra-read. A policy called
    # "infra-read" that can write would be a lie in the one place where lies are
    # expensive, and two policies are what an audit of "who may write" should
    # find.
    - name: Fetch the existing write policy, if any
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_write_policy_name }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200, 404]
      register: _write_policy
      check_mode: false
      tags:
        - config

    - name: Determine whether the write policy needs writing
      ansible.builtin.set_fact:
        _need_write_policy: >-
          {{ _write_policy.status == 404
             or (_write_policy.json.data.policy | default('')) != openbao_write_policy_hcl }}
      tags:
        - config

    - name: Write the narrow hawser write policy
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_write_policy_name }}"
        method: PUT
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          policy: "{{ openbao_write_policy_hcl }}"
        status_code: [200, 204]
      no_log: true
      changed_when: _need_write_policy | bool
      when: _need_write_policy | bool
      tags:
        - config

    - name: Fetch the ssh signing policy, if any
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_ssh_policy_name }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200, 404]
      register: _ssh_policy
      check_mode: false
      tags:
        - config

    - name: Determine whether the ssh signing policy needs writing
      ansible.builtin.set_fact:
        _need_ssh_policy: >-
          {{ _ssh_policy.status == 404
             or (_ssh_policy.json.data.policy | default('')) != openbao_ssh_policy_hcl }}
      tags:
        - config

    # Written here even when the SSH engine does not exist yet: a policy may
    # reference a path that is not mounted, and creating it first means the
    # AppRole below never points at a policy that is missing. openbao-ssh-ca.yml
    # creates the engine itself.
    - name: Write the ssh signing policy
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_ssh_policy_name }}"
        method: PUT
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          policy: "{{ openbao_ssh_policy_hcl }}"
        status_code: [200, 204]
      no_log: true
      changed_when: _need_ssh_policy | bool
      when: _need_ssh_policy | bool
      tags:
        - config

    - name: Fetch the snapshot policy, if any
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_snapshot_policy_name }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200, 404]
      register: _snapshot_policy
      check_mode: false
      tags:
        - config

    - name: Determine whether the snapshot policy needs writing
      ansible.builtin.set_fact:
        _need_snapshot_policy: >-
          {{ _snapshot_policy.status == 404
             or (_snapshot_policy.json.data.policy | default(''))
                != openbao_snapshot_policy_hcl }}
      tags:
        - config

    - name: Write the snapshot policy
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_snapshot_policy_name }}"
        method: PUT
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          policy: "{{ openbao_snapshot_policy_hcl }}"
        status_code: [200, 204]
      no_log: true
      changed_when: _need_snapshot_policy | bool
      when: _need_snapshot_policy | bool
      tags:
        - config

    - name: Fetch the enabled auth methods
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/auth"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _auth
      check_mode: false
      tags:
        - config

    - name: Determine whether AppRole auth is missing
      ansible.builtin.set_fact:
        _need_approle: >-
          {{ 'approle/'
             not in (_auth.json.data | default(_auth.json, true)).keys() | list }}
      tags:
        - config

    - name: Enable the AppRole auth method
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/auth/approle"
        method: POST
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          type: approle
        status_code: [200, 204]
      no_log: true
      changed_when: _need_approle | bool
      when: _need_approle | bool
      tags:
        - config

    - name: Fetch the AppRole role, if any
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/auth/approle/role/{{ openbao_approle_name }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200, 404]
      register: _role
      check_mode: false
      tags:
        - config

    - name: Determine whether the AppRole role needs creating
      ansible.builtin.set_fact:
        _need_role: >-
          {{ _role.status == 404
             or (_role.json.data.token_policies | default([]) | sort)
                != ([openbao_policy_name, openbao_write_policy_name,
                     openbao_ssh_policy_name, openbao_snapshot_policy_name]
                    | sort) }}
      tags:
        - config

    # token_ttl is short on purpose: a token minted during a playbook run
    # expires on its own. secret_id_ttl is 0 (never) because nothing rotates it
    # yet — a known cost recorded in #2, not an oversight.
    - name: Create the Semaphore AppRole role
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/auth/approle/role/{{ openbao_approle_name }}"
        method: POST
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          token_policies: ["{{ openbao_policy_name }}", "{{ openbao_write_policy_name }}",
                           "{{ openbao_ssh_policy_name }}",
                           "{{ openbao_snapshot_policy_name }}"]
          token_ttl: "20m"
          token_max_ttl: "1h"
          secret_id_ttl: 0
          secret_id_num_uses: 0
          bind_secret_id: true
        status_code: [200, 204]
      no_log: true
      changed_when: _need_role | bool
      when: _need_role | bool
      tags:
        - config

    - name: Fetch the operator signing policy, if any
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_operator_policy_name }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200, 404]
      register: _operator_policy
      check_mode: false
      tags:
        - config

    - name: Determine whether the operator signing policy needs writing
      ansible.builtin.set_fact:
        _need_operator_policy: >-
          {{ _operator_policy.status == 404
             or (_operator_policy.json.data.policy | default(''))
                != openbao_operator_policy_hcl }}
      tags:
        - config

    - name: Write the operator signing policy
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/policies/acl/{{ openbao_operator_policy_name }}"
        method: PUT
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          policy: "{{ openbao_operator_policy_hcl }}"
        status_code: [200, 204]
      no_log: true
      changed_when: _need_operator_policy | bool
      when: _need_operator_policy | bool
      tags:
        - config

    # Reuses the _auth snapshot taken before AppRole was enabled: each method is
    # checked against its own key, so a stale entry for one cannot affect the
    # other.
    - name: Determine whether userpass auth is missing
      ansible.builtin.set_fact:
        _need_userpass: >-
          {{ 'userpass/'
             not in (_auth.json.data | default(_auth.json, true)).keys() | list }}
      tags:
        - config

    - name: Enable the userpass auth method
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/sys/auth/userpass"
        method: POST
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          type: userpass
        status_code: [200, 204]
      no_log: true
      changed_when: _need_userpass | bool
      when: _need_userpass | bool
      tags:
        - config

    # The account itself is NOT created here, and that is the point: creating it
    # requires a password, and the operator's password must never pass through a
    # playbook, a log or this repository. So the split is by who owns the value —
    # the person owns the password, the playbook owns the privileges.
    #
    # The split is safe because of what the handler does (path_users.go, v2.6.2):
    # the password is validated only `if req.Operation == logical.CreateOperation`,
    # and applied only `if password != "" || passwordHash != ""`. An update that
    # omits it leaves the stored hash untouched. So this can rewrite the rights of
    # an existing account for ever without knowing how to log into it.
    - name: Fetch the operator account, if any
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/auth/userpass/users/{{ openbao_operator_username }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200, 404]
      register: _operator_user
      check_mode: false
      tags:
        - config

    # Seconds, not "8h", because that is what the read returns — comparing the
    # written spelling against the rendered one is how the sshd_config assert
    # went green on a value it had never checked.
    #
    # A working day per password entry. The token is worth one thing (ask for a
    # certificate), and the certificate it asks for lives an hour, so a stolen
    # token buys an hour of access at a time and nothing that outlives it.
    - name: Determine whether the operator account's rights need updating
      ansible.builtin.set_fact:
        _need_operator_rights: >-
          {{ _operator_user.status == 200
             and ((_operator_user.json.data.token_policies | default([]) | sort)
                  != [openbao_operator_policy_name]
                  or (_operator_user.json.data.token_ttl | default(0) | int) != 28800
                  or (_operator_user.json.data.token_max_ttl | default(0) | int) != 43200) }}
      tags:
        - config

    - name: Set the operator account's rights, leaving its password untouched
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/auth/userpass/users/{{ openbao_operator_username }}"
        method: POST
        headers: "{{ _api_headers }}"
        body_format: json
        body:
          token_policies: ["{{ openbao_operator_policy_name }}"]
          token_ttl: 28800
          token_max_ttl: 43200
        status_code: [200, 204]
      no_log: true
      changed_when: _need_operator_rights | bool
      when: _need_operator_rights | bool
      tags:
        - config

    # role_id is NOT a secret (#2): it identifies the role, and authentication
    # additionally requires the secret_id. Printing it is intended — it belongs
    # in the inventory.
    - name: Read the role_id
      ansible.builtin.uri:
        url: "{{ openbao_api }}/v1/auth/approle/role/{{ openbao_approle_name }}/role-id"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _role_id
      check_mode: false
      tags:
        - config

    - name: Report the result and what the operator must do next
      ansible.builtin.debug:
        msg:
          - "KV v2 at {{ openbao_kv_mount }}/ · policy {{ openbao_policy_name }} · AppRole {{ openbao_approle_name }}"
          - "role_id = {{ _role_id.json.data.role_id }}  (not a secret — it belongs in the inventory)"
          - "NEXT, as the operator. Generate the secret_id WRAPPED, so it is never printed in clear:"
          - "  docker exec -it openbao bao write -wrap-ttl=5m -f auth/approle/role/{{ openbao_approle_name }}/secret-id"
          - "  docker exec -it openbao bao unwrap <wrapping_token>"
          - "A wrapping token unwraps exactly ONCE: if someone got there first, YOUR unwrap fails and you learn it leaked."
          - "Put the secret_id in a Semaphore Variable Group as a secret env var (Key Store entries are connection credentials; playbooks cannot read them)."
          - "Recovering root needs openbao_allow_root_generation=true, an apply, an unseal, generate-root, then the same again to turn it off — see the role README."
          - "BEFORE revoking root: OpenBao DISABLES generate-root by default since 2.5.3, so recovery is NOT one command."
          - "Then copy the secret VALUES into KV yourself: infra/telegram, infra/netbird, infra/remnawave, infra/semaphore, infra/beszel, infra/crowdsec, infra/hawser"
      tags:
        - debug

    # The account is the one thing here a playbook cannot finish, so its state
    # is invisible unless it is said out loud. Reported every run, not only when
    # missing: "the account exists with these rights" is the answer to the
    # question this playbook is run to settle.
    - name: Report the operator account
      ansible.builtin.debug:
        msg: >-
          {{
            ('Operator account ' ~ openbao_operator_username ~ ' exists, policy '
             ~ openbao_operator_policy_name ~ ' — it can ask for an SSH certificate and nothing else.')
            if _operator_user.status == 200
            else ('Operator account ' ~ openbao_operator_username ~ ' does NOT exist. Create it with a password '
                  ~ 'only you know, then re-run this playbook to grant its rights: '
                  ~ 'read -rs -p "new password: " P && echo && printf %s "$P" | '
                  ~ 'docker exec -i openbao bao write auth/userpass/users/' ~ openbao_operator_username
                  ~ ' password=- && unset P')
          }}
      tags:
        - debug
