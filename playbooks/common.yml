---
# Re-apply the baseline `common` role to an explicit target. Provisioning runs
# it once (provision-node.yml), but the role keeps evolving — swap, sysctls,
# packages — and existing fleet hosts need a way to catch up without a full
# re-provision.
#
# The target is a variable so one Semaphore template covers every case:
#   common_target=node-a  one canary node
#   common_target=fleet   the whole fleet
#   common_target=lab     the lab node (the default, so a mis-click cannot
#                         touch production)
#
# Semaphore: set it as a survey variable named `common_target`, or pass
# `-e common_target=<host>` in the template's CLI args. `--check --diff` gives
# a dry run first (note: the swap tasks read state with `command`, which check
# mode skips, so their preview is indicative rather than exact).
- name: Apply the common baseline
  hosts: "{{ common_target | default('lab') }}"
  become: true
  roles:
    - common
