---
# Deploy the node's workload stack from the pipeline — the "second click" that
# used to be done by hand in Dockhand after provisioning (#136).
#
# The compose file lives in the docker-stacks repository; Dockhand deploys it as
# a From-Git stack and keeps it in sync by POLLING, never by inbound webhook
# (CLAUDE.md §12, #24). webhookEnabled stays false.
#
# Usable two ways, like dns-record.yml and dockhand-environment.yml:
#   1. imported by provision-node.yml, inheriting node_name;
#   2. standalone:  -e node_name=lab-1
#
# NAMING. The stack is named for what it runs (`remnanode`), the ENVIRONMENT for
# where it runs (`LAB-1`). Dockhand scopes stack names per environment, so the
# same stack name repeats across the fleet without colliding. Override with
# -e dockhand_stack_name=<name> only when deploying something else entirely.
#
# node_name remains the NODE's identity and is what NODE_NAME, the certificate
# host label and the camouflage seed are built from. The two were the same
# string until 2026-08-13 and three places had come to rely on that.
#
# WHY delegate_to: panel — Dockhand and the Remnawave panel both answer on the
# panel's loopback, unreachable from the Semaphore container. Running the
# requests on the panel is what new-node.yml already does.

- name: Deploy the node's workload stack
  hosts: "{{ dockhand_stack_target | default('controller') }}"
  gather_facts: false

  vars:
    # The stack is named for WHAT IT RUNS, the environment for WHERE it runs.
    # Dockhand scopes stack names per environment (its own 409 says "on this
    # environment"), so every node can carry a stack called `remnanode` while
    # the environment keeps the node's identity.
    #
    # This used to be node_name, and two derived values quietly depended on the
    # coincidence — NODE_NAME below, and the camouflage seed. Both now read
    # node_name directly. Anything else that needs the NODE must do the same:
    # this variable no longer identifies one.
    _stack_name: "{{ dockhand_stack_name | default('remnanode') }}"
    _env_name: "{{ (node_name | default('')) | upper }}"
    _dockhand_api: "{{ dockhand_api_url | default('http://127.0.0.1:3040') }}"
    # Matched by the SLUG at the end of the repository URL, not by Dockhand's
    # display name. The display name is free text a human chose — ours reads
    # "Docker Compose stacks deployed via Dockhand" — and renaming it must not
    # break provisioning. The slug is the repository's actual identity, and
    # matching on the tail of the URL keeps the account out of this file.
    _repo_slug: "{{ dockhand_stack_repo | default('docker-stacks') }}"
    _compose_path: "{{ dockhand_stack_compose | default('remnanode/docker-compose.yml') }}"
    # When the scheduled sync deploys a merged change. Dockhand reads this cron
    # in UTC — measured 2026-08-19, when the default '0 3 * * *' fired at 03:00
    # UTC — so this is 14:00 in Karaganda, deliberately a working hour.
    #
    # The hour is the whole point of choosing polling over a webhook. A broken
    # deploy breaks either way; what differs is whether anybody is awake when it
    # lands. Delivery at 03:00 local would be discovered the next morning.
    _stack_sync_cron: "{{ dockhand_stack_sync_cron | default('0 9 * * *') }}"
    # Reality camouflage: the decoy site served on 443 to anything that is not a
    # valid reality client. The compose file already reads ${CAMO_SITE} and
    # falls back to `converter`, so never setting it made every node serve the
    # SAME page — precisely what the mechanism exists to prevent.
    #
    # The list mirrors the directories in docker-stacks remnanode/www/. It is
    # carried here rather than discovered: the controller has no checkout of
    # that repository, Dockhand is what clones it. A name that is not there
    # fails the deploy loudly (the bind sets create_host_path: false), which is
    # better than mounting an empty directory and serving a blank page.
    #
    # 503-1 and 503-2 exist there but are left out of the pool — a node
    # permanently serving a maintenance page looks broken, and looking broken is
    # itself a distinguishing mark. Add them via dockhand_stack_camo_sites to
    # use them anyway.
    _camo_sites: >-
      {{ dockhand_stack_camo_sites
         | default(['10gag', 'YouTube', 'converter', 'convertit', 'downloader',
                    'filecloud', 'games-site', 'modmanager', 'speedtest']) }}
    # Seeded with the NODE name, so the pick is arbitrary ACROSS nodes but
    # stable FOR one: a re-run cannot land on a different site and redeploy the
    # stack for nothing. The write below is guarded on absence as well — this is
    # the second lock, not the only one.
    #
    # It must be node_name and not the stack name: the stack name is now the
    # same string on every node, and seeding with a constant would hand the
    # whole fleet one identical decoy page — exactly the fingerprint CAMO_SITE
    # exists to prevent.
    _camo_site: "{{ _camo_sites | random(seed=node_name | default('')) }}"

  tasks:
    # Both names are checked, because they are no longer the same string and
    # they fail differently. A bad STACK name is rejected by Dockhand with a
    # 400 you can read. A bad NODE name is accepted everywhere and then shows
    # up as a certificate for the wrong host and a decoy page shared with the
    # rest of the fleet — no error, just a node that quietly does not work.
    - name: Assert the node and the stack are named
      ansible.builtin.assert:
        that:
          - node_name | default('') | length > 0
          - node_name is match('^[a-z0-9][a-z0-9-]*$')
          - _stack_name | length > 0
          - _stack_name is match('^[a-z0-9][a-z0-9_-]*$')
        fail_msg: >-
          node_name is required and must be lowercase — it becomes NODE_NAME in
          the stack (and thus the certificate's host label) and seeds the
          camouflage page. Pass it as a survey variable, or with
          -e node_name=<name> when running this playbook standalone.
          dockhand_stack_name, if overridden, must be lowercase too: Dockhand
          rejects a stack name that is not.
      tags:
        - config

    - name: Fetch the Dockhand API token
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: dockhand
        openbao_read_field: api_token
        openbao_read_into: _dockhand_api_token
      tags:
        - config

    - name: Fetch the Remnawave API token
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: remnawave
        openbao_read_field: api_token
        openbao_read_into: _remnawave_api_token
      tags:
        - config

    - name: Fetch the Cloudflare DNS token
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: cloudflare
        openbao_read_field: dns_token
        openbao_read_into: _cloudflare_dns_token
      tags:
        - config

    # no_log on every call that carries a bearer token: headers are part of the
    # module arguments, which Ansible prints on failure and at -vvv.
    - name: List the Dockhand environments
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/environments"
        method: GET
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        status_code: [200]
      register: _dockhand_envs
      delegate_to: panel
      no_log: true
      changed_when: false
      check_mode: false
      tags:
        - config

    - name: List the registered git repositories
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/git/repositories"
        method: GET
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        status_code: [200]
      register: _dockhand_repos
      delegate_to: panel
      no_log: true
      changed_when: false
      check_mode: false
      tags:
        - config

    - name: Resolve the environment and the repository
      ansible.builtin.set_fact:
        _env_id: >-
          {{ _dockhand_envs.json | selectattr('name', 'equalto', _env_name)
             | map(attribute='id') | list | first | default('') }}
        # Matches .../<slug> and .../<slug>.git, whether the remote is ssh or
        # https, and ignores whatever the repository is called in the UI.
        _repo_id: >-
          {{ _dockhand_repos.json
             | selectattr('url', 'search', '/' ~ _repo_slug ~ '(\.git)?$')
             | map(attribute='id') | list | first | default('') }}
      no_log: true
      tags:
        - config

    # Both must exist already: the environment is created by
    # dockhand-environment.yml earlier in the pipeline, and the repository is
    # registered once by hand for the whole fleet. Failing here names which.
    - name: Assert the environment and repository were found
      ansible.builtin.assert:
        that:
          - _env_id | string | length > 0
          - _repo_id | string | length > 0
        fail_msg: >-
          Dockhand has no environment named {{ _env_name }}, or no git
          repository whose URL ends with /{{ _repo_slug }}. The environment
          comes from dockhand-environment.yml; the repository is registered
          once in Dockhand for the whole fleet, and is matched by the slug in
          its URL rather than by its display name. Override the slug with
          -e dockhand_stack_repo=<slug>.
      tags:
        - config

    # No "does it exist" query: Dockhand answers 409 when the name is already
    # taken on this environment, which is a more reliable existence check than
    # anything we could compute, and one round trip fewer.
    #
    # autoUpdate with a schedule is the polling delivery §12 requires; the
    # webhook stays off, and the endpoint would demand a secret for it anyway.
    - name: "Ensure the From-Git stack exists for {{ _env_name }}"
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/git/stacks"
        method: POST
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        body_format: json
        body: >-
          {{ {'stackName': _stack_name,
              'environmentId': _env_id | int,
              'repositoryId': _repo_id | int,
              'composePath': _compose_path,
              'autoUpdate': true,
              'autoUpdateSchedule': 'daily',
              'autoUpdateCron': _stack_sync_cron,
              'webhookEnabled': false} }}
        status_code: [200, 201, 409]
      register: _stack_created
      delegate_to: panel
      no_log: true
      changed_when: _stack_created.status in [200, 201]
      tags:
        - config

    # The 409 proves the stack exists but does not say WHICH one: the body is
    # {"error": "A stack with this name already exists on this environment"} and
    # carries no id — verified in the upstream handler for the pinned v1.0.41.
    # A created stack answers with the record itself, so `.json.id` is only
    # populated on the 200/201 path.
    #
    # The deploy at the end of this file guards on a non-empty id, so the
    # missing one never reached the URL — it SKIPPED the deploy instead, wrote
    # the environment and reported success. A stack that gained a variable after
    # it was first created (CAMO_SITE was added long after the earliest nodes)
    # therefore sat undeployed with nothing in the log to say so.
    - name: List the environment's git stacks to find the existing one
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/git/stacks?env={{ _env_id | int }}"
        method: GET
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        status_code: [200]
      register: _stack_list
      delegate_to: panel
      no_log: true
      changed_when: false
      check_mode: false
      when: _stack_created.status | default(0) == 409
      tags:
        - config

    # That endpoint answers with objects carrying id, stackName and
    # environmentId, and the ?env= query already scopes the list — so the name
    # alone identifies the stack.
    - name: Resolve the effective stack id
      ansible.builtin.set_fact:
        _stack_id: >-
          {{ _stack_created.json.id | default('')
             if (_stack_created.status | default(0) in [200, 201])
             else (_stack_list.json | default([])
                   | selectattr('stackName', 'equalto', _stack_name)
                   | map(attribute='id') | list | first | default('')) }}
      tags:
        - config

    - name: Assert the stack id was resolved
      ansible.builtin.assert:
        that:
          - _stack_id | string | length > 0
        fail_msg: >-
          Dockhand answered 409 for stack {{ _stack_name }} on {{ _env_name }},
          but GET /api/git/stacks?env={{ _env_id | int }} does not list it under
          that name. The 409 covers ANY stack of that name on the environment —
          internal and adopted stacks share the name space with From-Git ones —
          so this most likely means {{ _stack_name }} exists as a stack that
          cannot be deployed from here. Check it in Dockhand before re-running.
      when: _stack_created.status | default(0) != 0
      tags:
        - config

    # Creation settles the schedule for a NEW stack only: a 409 means the stack
    # already exists and POST changed nothing about it. Every node provisioned
    # before this variable existed therefore still carries Dockhand's default
    # '0 3 * * *', and would keep it forever — the same create-but-never-reconcile
    # gap that let the Semaphore templates drift.
    - name: Read the stack's current sync schedule
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/git/stacks/{{ _stack_id | int }}"
        method: GET
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        status_code: [200]
      register: _stack_settings
      delegate_to: panel
      no_log: true
      changed_when: false
      check_mode: false
      tags:
        - config

    # Fetch-then-guard: the PUT fires only when the schedule is actually wrong,
    # so a settled node reports changed=0.
    #
    # Every field the handler reads is sent back from current state, because it
    # passes them straight into the update. webhookSecret is the deliberate
    # exception — the handler keeps the stored one when the field is absent, and
    # sending back a value we read would risk writing a masked placeholder over
    # a real secret.
    - name: Correct the stack's sync schedule
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/git/stacks/{{ _stack_id | int }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        body_format: json
        body: >-
          {{ {'stackName': _stack_settings.json.stackName,
              'composePath': _stack_settings.json.composePath,
              'envFilePath': _stack_settings.json.envFilePath,
              'autoUpdate': true,
              'autoUpdateSchedule': _stack_settings.json.autoUpdateSchedule | default('daily'),
              'autoUpdateCron': _stack_sync_cron,
              'webhookEnabled': _stack_settings.json.webhookEnabled | default(false),
              'contextDir': _stack_settings.json.contextDir,
              'buildOnDeploy': _stack_settings.json.buildOnDeploy | default(false),
              'noBuildCache': _stack_settings.json.noBuildCache | default(false),
              'repullImages': _stack_settings.json.repullImages | default(false),
              'forceRedeploy': _stack_settings.json.forceRedeploy | default(false)} }}
        status_code: [200]
      register: _stack_schedule_fixed
      delegate_to: panel
      no_log: true
      when: >-
        (_stack_settings.json.autoUpdateCron | default('')) != _stack_sync_cron
        or not (_stack_settings.json.autoUpdate | default(false) | bool)
      changed_when: _stack_schedule_fixed.status | default(0) == 200
      tags:
        - config

    - name: Report the delivery schedule
      ansible.builtin.debug:
        msg: >-
          {{ _stack_name }} on {{ _env_name }} syncs from git at
          {{ _stack_sync_cron }} UTC
          {{ '(corrected this run)' if _stack_schedule_fixed is changed
             else '(already set)' }}.
      tags:
        - debug
        - config

    - name: Read the stack's environment variables
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/stacks/{{ _stack_name }}/env?env={{ _env_id | int }}"
        method: GET
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        status_code: [200]
      register: _stack_env
      delegate_to: panel
      no_log: true
      changed_when: false
      check_mode: false
      tags:
        - config

    # The VALUES are kept too, not just the key names. A secret is preserved by
    # sending '***' back, but that mechanism is for secrets only — a non-secret
    # whose value was chosen once (CAMO_SITE) has to be echoed verbatim, or the
    # next run overwrites it with a different choice.
    - name: Note which variables are already set
      ansible.builtin.set_fact:
        _existing_keys: >-
          {{ (_stack_env.json.variables | default(_stack_env.json) | default([]))
             | map(attribute='key') | list }}
        _existing_env: >-
          {{ (_stack_env.json.variables | default(_stack_env.json) | default([]))
             | items2dict(key_name='key', value_name='value') }}
      no_log: true
      tags:
        - config

    # SECRET_KEY is minted by the panel, and GET /api/keygen mints a NEW one on
    # every call — it is not a lookup. So it is fetched only when the stack does
    # not have one yet; calling it every run would rewrite the value and force a
    # redeploy each time, which is the always-changed defect of #122.
    #
    # It is deliberately NOT stored in OpenBao. Nothing binds a payload to a
    # particular node (they share the panel's CA and JWT key), so it is
    # regenerable at any moment — putting it in the secret store would add a
    # value to back up that nothing needs backing up.
    - name: Mint a node SECRET_KEY from the panel
      ansible.builtin.uri:
        url: "{{ remnawave_panel_url }}/api/keygen"
        method: GET
        headers: >-
          {{ {'Authorization': 'Bearer ' ~ _remnawave_api_token,
              'X-Forwarded-For': '127.0.0.1',
              'X-Forwarded-Proto': 'https'}
             | combine({'Host': remnawave_panel_host}
                       if (remnawave_panel_host | default('') | length > 0)
                       else {}) }}
        status_code: [200]
      register: _keygen
      delegate_to: panel
      no_log: true
      changed_when: false
      when: "'SECRET_KEY' not in _existing_keys"
      tags:
        - config

    # The field was RENAMED between panel versions: 2.8.x returns
    # `response.pubKey`, 3.x returns `response.secretKey`. Both carry the same
    # node payload — the response model is constructed from the same value — so
    # accept either rather than pinning the playbook to one panel version.
    - name: Resolve the minted key from whichever field this panel uses
      ansible.builtin.set_fact:
        _secret_key: >-
          {{ _keygen.json.response.secretKey
             | default(_keygen.json.response.pubKey | default(''), true) }}
      no_log: true
      when: "'SECRET_KEY' not in _existing_keys"
      tags:
        - config

    # A rename we did not anticipate must stop the run here, where the cause is
    # obvious, rather than write an empty SECRET_KEY into the stack and leave a
    # node that starts and immediately refuses to work.
    - name: Assert the panel returned a key
      ansible.builtin.assert:
        that:
          - _secret_key | default('') | length > 0
        fail_msg: >-
          GET /api/keygen returned neither `secretKey` nor `pubKey`. The field
          has been renamed again — check the panel version's contract before
          guessing.
      when: "'SECRET_KEY' not in _existing_keys"
      tags:
        - config

    # Built once and then used twice — as the diff input and as the request
    # body. Two hand-maintained copies of this list are precisely how the write
    # and its change detection came to disagree: the body sent every value while
    # the detection only asked which KEYS were absent.
    #
    # A secret sent back as '***' keeps its stored value — that is the server's
    # own mechanism, and it is what lets this PUT be a full list without ever
    # re-sending a credential it already holds.
    - name: Build the environment this playbook wants
      ansible.builtin.set_fact:
        _desired_env:
          - key: ACME_DOMAIN
            value: "{{ infra_domain }}"
            isSecret: false
          # The NODE's name, never the stack's. Angie builds its server_name
          # from NODE_NAME and ACME_DOMAIN, so this string is the host label the
          # certificate is issued for and the SNI reality advertises. Feeding it
          # the stack name would issue a certificate for a host that does not
          # exist — the same desync closed in #22, arriving from the other side.
          - key: NODE_NAME
            value: "{{ node_name }}"
            isSecret: false
          - key: CAMO_SITE
            value: "{{ _existing_env.get('CAMO_SITE') | default(_camo_site, true) }}"
            isSecret: false
          - key: CF_API_TOKEN
            value: "{{ '***' if 'CF_API_TOKEN' in _existing_keys else _cloudflare_dns_token }}"
            isSecret: true
          - key: SECRET_KEY
            value: "{{ '***' if 'SECRET_KEY' in _existing_keys else _secret_key }}"
            isSecret: true
      no_log: true
      tags:
        - config

    - name: Split the desired environment into comparable and unreadable halves
      ansible.builtin.set_fact:
        _desired_plain: >-
          {{ _desired_env | rejectattr('isSecret')
             | items2dict(key_name='key', value_name='value') }}
        _desired_secret_keys: >-
          {{ _desired_env | selectattr('isSecret') | map(attribute='key') | list }}
      no_log: true
      tags:
        - config

    # A secret comes back masked, so its value CANNOT be compared — presence is
    # the only signal available for those. Non-secrets do come back verbatim on
    # a git stack, where every variable is stored in Dockhand's database, so
    # those are compared properly.
    #
    # The projection is what makes the answer honest: the stored environment is
    # narrowed to the keys this playbook owns, then compared with the desired
    # map. A missing key and a changed value both surface as one dict
    # inequality, while a variable somebody added by hand is not read as drift
    # and does not trigger a deploy.
    - name: Decide whether the environment actually needs writing
      ansible.builtin.set_fact:
        _env_needs_write: >-
          {{ _desired_plain != (_existing_env | dict2items
                                | selectattr('key', 'in', _desired_plain.keys() | list)
                                | items2dict)
             or (_desired_secret_keys | reject('in', _existing_keys)
                 | list | length > 0) }}
      no_log: true
      tags:
        - config

    - name: Write the stack's environment variables
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/stacks/{{ _stack_name }}/env?env={{ _env_id | int }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        body_format: json
        body: "{{ {'variables': _desired_env} }}"
        status_code: [200]
      delegate_to: panel
      no_log: true
      changed_when: _env_needs_write | bool
      when: _env_needs_write | bool
      tags:
        - config

    # Only when something actually changed. A deploy pulls images and recreates
    # containers, so triggering it on every run would restart a working node for
    # nothing.
    - name: Deploy the stack
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/git/stacks/{{ _stack_id }}/deploy"
        method: POST
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        status_code: [200, 201, 202]
      register: _stack_deployed
      delegate_to: panel
      no_log: true
      changed_when: true  # spec-ok: a deploy always acts; it is guarded by `when`
      when:
        - _stack_id | string | length > 0
        - _env_needs_write | bool
          or _stack_created.status | default(0) in [200, 201]
      tags:
        - config

    - name: Report without revealing anything
      ansible.builtin.debug:
        msg: >-
          Stack {{ _stack_name }} on {{ _env_name }}:
          {{ 'created' if _stack_created.status in [200, 201] else 'already existed' }};
          SECRET_KEY {{ 'minted' if 'SECRET_KEY' not in _existing_keys else 'kept' }};
          camouflage page
          {{ _existing_env.get('CAMO_SITE') | default(_camo_site, true) }}
          ({{ 'assigned' if 'CAMO_SITE' not in _existing_keys else 'kept' }});
          environment {{ 'written' if _env_needs_write | bool else 'already matched' }};
          {{ 'DEPLOYED' if not (_stack_deployed is skipped) else 'not deployed' }};
          polling auto-update on, webhook off.
      tags:
        - debug
