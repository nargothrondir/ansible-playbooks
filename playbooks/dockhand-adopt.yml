---
# Register the Ansible-deployed Hawser stack in Dockhand, so its row says what it
# is instead of "Untracked".
#
# WHY THIS IS SAFE for the one stack Dockhand must never deploy: adoption
# REGISTERS, it does not deploy. Upstream is explicit — "Does NOT deploy - just
# registers the stack" (stack-scanner.ts, adoptStack). Deploying it would make
# the agent run `compose up` on the project containing itself; measured on the
# lab node 2026-08-13, the replacement container was left in `Created` and the
# node lost management until an Ansible run restored it.
#
# The resulting sourceType is `internal`, which is the honest label: Dockhand
# knows the stack and where its compose file lives, and does not deliver it.
# A `git` record would claim delivery it cannot perform, and leaves Location
# empty besides.
#
# ORDER: this must run AFTER roles/hawser. Dockhand looks the running stack up
# through the agent before adopting, so the agent has to be connected and the
# compose file already on the host.
#
# Usable two ways, like dns-record.yml and dockhand-environment.yml:
#   1. imported by provision-node.yml, inheriting node_name;
#   2. standalone:  -e node_name=lab-1
#
# WHY delegate_to: panel — Dockhand answers on the panel's loopback, which is
# unreachable from the Semaphore container.

- name: Register the agent's own stack in Dockhand
  hosts: "{{ dockhand_adopt_target | default('controller') }}"
  gather_facts: false

  vars:
    _env_name: "{{ (node_name | default('')) | upper }}"
    _dockhand_api: "{{ dockhand_api_url | default('http://127.0.0.1:3040') }}"
    # The agent's stack is called the same thing in every environment: names are
    # scoped per environment, and the environment already carries the node.
    _adopt_stack: "{{ dockhand_adopt_stack | default('hawser') }}"
    _adopt_compose: "{{ (hawser_dir | default('/opt/hawser')) ~ '/docker-compose.yml' }}"

  tasks:
    - name: Assert the node is named
      ansible.builtin.assert:
        that:
          - node_name | default('') | length > 0
        fail_msg: >-
          node_name is required. Pass it as a survey variable, or with
          -e node_name=<name> when running this playbook standalone.
      tags:
        - config

    - name: Fetch the Dockhand API token
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: dockhand
        openbao_read_field: api_token
        openbao_read_into: _dockhand_api_token
      tags:
        - config

    # no_log on every Dockhand call: the Authorization header is part of the
    # module arguments, and Ansible prints those on failure and at -vvv.
    - name: List the Dockhand environments
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/environments"
        method: GET
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        status_code: [200]
      register: _adopt_envs
      delegate_to: panel
      no_log: true
      changed_when: false
      tags:
        - config

    - name: Resolve the environment id
      ansible.builtin.set_fact:
        _env_id: >-
          {{ (_adopt_envs.json | default([])
              | selectattr('name', 'equalto', _env_name) | list
              | first | default({})).id | default('') }}
      tags:
        - config

    - name: Assert the environment exists
      ansible.builtin.assert:
        that:
          - _env_id | string | length > 0
        fail_msg: >-
          No Dockhand environment named {{ _env_name }}. Run
          dockhand-environment.yml first — this playbook registers a stack in an
          environment, it does not create one.
      tags:
        - config

    # Fetch-then-guard (§6). Adopting twice is not an error upstream, it answers
    # "Already adopted" — but a stack whose name is taken gets a `-1` suffix
    # instead, which would leave a second, permanently wrong row. Reading the
    # sources first is what keeps that from happening.
    - name: Read which stacks Dockhand already tracks
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/stacks/sources?env={{ _env_id | int }}"
        method: GET
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        status_code: [200]
      register: _adopt_sources
      delegate_to: panel
      no_log: true
      changed_when: false
      tags:
        - config

    - name: Determine whether the agent's stack is already tracked
      ansible.builtin.set_fact:
        _adopt_needed: "{{ _adopt_stack not in (_adopt_sources.json | default({})) }}"
      tags:
        - config

    - name: Adopt the agent's stack
      ansible.builtin.uri:
        url: "{{ _dockhand_api }}/api/stacks/adopt"
        method: POST
        headers:
          Authorization: "Bearer {{ _dockhand_api_token }}"
        body_format: json
        body: >-
          {{ {'environmentId': _env_id | int,
              'stacks': [{'name': _adopt_stack,
                          'composePath': _adopt_compose}]} }}
        status_code: [200]
      register: _adopted
      delegate_to: panel
      no_log: true
      changed_when: _adopt_needed | bool
      when: _adopt_needed | bool
      tags:
        - config

    - name: Report what Dockhand now tracks
      ansible.builtin.debug:
        msg: >-
          Stack {{ _adopt_stack }} on {{ _env_name }}:
          {{ 'adopted — Dockhand now shows it with its compose path'
             if _adopt_needed | bool
             else 'already tracked as '
                  ~ ((_adopt_sources.json | default({})).get(_adopt_stack, {}).get('sourceType', '?')) }}.
          Dockhand tracks it; Ansible deploys it. Never redeploy it from
          Dockhand — the agent would recreate its own container and strand
          the node.
      tags:
        - debug
        - config
