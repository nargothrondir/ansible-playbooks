---
# Provision baseline software and Docker on lab hosts.
# Prerequisite: the host is bootstrapped (site.yml) — connects as the
# automation user with sudo.
#
# Run:  ansible-playbook playbooks/provision.yml

- name: Provision baseline packages and Docker
  hosts: lab
  gather_facts: true
  become: true
  vars:
    ansible_user: "{{ bootstrap_user }}"
  roles:
    - common
    - docker
