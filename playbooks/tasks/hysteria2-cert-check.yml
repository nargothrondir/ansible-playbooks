---
# Check that remnanode on this node can read the certificate Hysteria2 needs.
# Included by enable-hysteria2.yml, which asserts on the result, and by
# provision-node.yml, which waits for Angie to issue the certificate and goes
# on without Hysteria2 if it never comes.
#
# Why it matters: Xray refuses to start with a TLS inbound whose certificate it
# cannot read, and it runs every inbound of the node in one process — so a
# missing certificate takes Reality TCP and xHTTP down with it. The certificate
# is Angie's own (docker-stacks remnanode mounts the angie-acme volume
# read-only at /etc/xray-tls).
#
# Expects:
#   hysteria2_cert_dir           must match new-profile.yml's profile_hysteria2_cert_dir
#   hysteria2_cert_wait_retries  0 checks once; N re-checks N times, 10 s apart
#
# Leaves _hysteria2_cert_check (rc 0 = readable) and never fails by itself:
# what a missing certificate means is the caller's decision.

# Read-only: `test -s` inside the container, as the root Xray runs as. On a node
# whose stack has just been deployed, remnanode may not exist yet either; the
# retries cover that too.
- name: Check that remnanode can read the certificate and key
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - remnanode
      - sh
      - -c
      - test -s {{ hysteria2_cert_dir }}/certificate.pem && test -s {{ hysteria2_cert_dir }}/private.key
  register: _hysteria2_cert_check
  until: _hysteria2_cert_check.rc == 0
  retries: "{{ hysteria2_cert_wait_retries | default(0) | int }}"
  delay: 10
  changed_when: false
  failed_when: false
