---
# Apply encrypted DNS (systemd-resolved + DoT) to an explicit target.
#
# Deliberately NOT wired into provision-node.yml yet: the role edits
# /etc/network/interfaces, which holds the node's STATIC address, and clears
# the resolver's link settings on a live host. Both are safe as written; both
# have now run on the lab node and nowhere else.
#
# On a node with a stack already up the role STOPS, because replacing
# /etc/resolv.conf leaves running containers with the resolver Docker copied
# for them at creation time — see issue #153 and roles/dns/README.md. Waive it
# with -e dns_allow_running_containers=true only when you will restart the
# stack afterwards.
#
#   ansible-playbook playbooks/dns.yml                    # the lab, by default
#   ansible-playbook playbooks/dns.yml -e dns_target=fi   # one canary node
#   ansible-playbook playbooks/dns.yml -e dns_target=fleet
#
# The default is the lab group, so a mis-click cannot reach the fleet — the
# same guard playbooks/common.yml uses.
#
# What this fixes, in one line: the nodes already speak DoT, but to resolvers
# the provider image chose, because interface DNS beats the global setting.
# See roles/dns/README.md.

- name: Configure encrypted DNS
  hosts: "{{ dns_target | default('lab') }}"
  become: true
  gather_facts: true

  vars:
    ansible_user: "{{ bootstrap_user }}"

  roles:
    - dns
