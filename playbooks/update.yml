---
# Update managed servers and report the result to Telegram.
#
# Telegram credentials come from OpenBao — infra/telegram, with bot_token and
# chat_id required and updates_topic_id optional (without it the report goes to
# General).
#
# Topics are per SOURCE, not one shared thread — infra/telegram carries
# updates_topic_id (this playbook), provisioning_topic_id (provision-node.yml)
# and ci_topic_id (mirrored into the GitHub Actions secret TELEGRAM_TOPIC_ID
# for ci-alert.yml). Each is optional and falls back rather than failing.
#
#   docker exec -it openbao bao kv put infra/telegram bot_token=... chat_id=...
#
# Run:  ansible-playbook playbooks/update.yml

- name: Update managed servers
  hosts: managed
  # One host at a time. managed holds the VPN nodes, and upgrade_reboot is on
  # for them: run in parallel, a kernel update landing on the whole fleet would
  # reboot every node in the same minute — every user disconnected at once,
  # with no node left to fall back to. In series the reboot module waits for
  # each host to come back before the next one starts. The report play below
  # reads host facts, which persist across batches.
  serial: 1
  # serial has a trap this is here for. When every host of a batch fails or is
  # unreachable, ansible-core breaks out of the WHOLE playbook, not just the
  # play (executor/playbook_executor.py) — and with a batch of one, a single
  # unreachable node would skip every node after it AND the Telegram report.
  # Ignoring unreachability keeps the batch alive; the ping below then ends
  # that host's run at once, instead of letting every remaining task spend a
  # minute of ssh retries on it. Its report line reads "no result
  # (unreachable?)". Task failures are rescued inside the block as before.
  ignore_unreachable: true
  gather_facts: true
  become: true
  vars:
    ansible_user: "{{ bootstrap_user }}"
    # Hosts are reached over the NetBird mesh, and upgrading the netbird package
    # restarts the agent (its postinst stops the service, reinstalls the unit,
    # starts it), taking the mesh down for seconds. The upgrade itself runs as
    # an async job and survives that (roles/upgrade); these retries are what let
    # the run's status polls survive it too — ssh exit 255 only, pausing
    # 0/1/3/7/15/30 s, about a minute in total.
    ansible_ssh_retries: 6

  tasks:
    # With ignore_unreachable on the play, an unreachable host would otherwise
    # stay in it and fail every task slowly. Ending it here removes it without
    # marking the batch failed, so the next host and the report still run.
    - name: Check the host answers
      ansible.builtin.ping:
      register: update_ping

    - name: Leave an unreachable host out of this run
      ansible.builtin.meta: end_host
      when: update_ping is unreachable

    - name: Upgrade the host, capturing failures for the report
      block:
        - name: Run the upgrade role
          ansible.builtin.include_role:
            name: upgrade

        # The journal cap belongs to roles/common, which only provisioning
        # runs. Applying it here is how hosts built before it existed catch up,
        # and how a hand edit gets put back. Inside the block so a failure is
        # rescued into the report like any other; its restart handler runs at
        # the end of this host's batch.
        - name: Keep the systemd journal within its size cap
          ansible.builtin.include_role:
            name: common
            tasks_from: journald.yml

        - name: Record a successful upgrade
          ansible.builtin.set_fact:
            update_status: ok
            update_reboot_needed: "{{ upgrade_reboot_required | default(false) | bool }}"
            # Actually rebooted only when the role is allowed to (panel has
            # upgrade_reboot: false and must be rebooted manually). upgrade_reboot
            # is the upgrade role's default, out of scope here at play level, so
            # mirror that default (true) — only host_vars overrides (panel) apply.
            update_rebooted: >-
              {{ (upgrade_reboot_required | default(false) | bool)
                 and (upgrade_reboot | default(true) | bool) }}
            # Two-pass parse: security-suite lines first (marked 🛡), then the rest.
            # Lines already rewritten by the first pass no longer match the second.
            update_packages: >-
              {{ upgrade_upgradable.stdout_lines | default([])
                 | difference(['Listing...'])
                 | map('regex_replace',
                        '^([^/]+)/\S*security\S*\s+(\S+)\s+\S+\s+\[upgradable from:\s+([^\]]+)\].*$',
                        '\g<1>: \g<3> → \g<2> 🛡')
                 | map('regex_replace',
                        '^([^/]+)/\S+\s+(\S+)\s+\S+\s+\[upgradable from:\s+([^\]]+)\].*$',
                        '\g<1>: \g<3> → \g<2>')
                 | map('regex_replace', '~\S*', '') | list }}
      rescue:
        - name: Record a failed upgrade
          ansible.builtin.set_fact:
            update_status: failed
            update_error: >-
              {{ (ansible_failed_result.msg | default('') | trim)
                 or (ansible_failed_result | to_json | truncate(400)) }}

# Reporting runs on the controller, independently of the managed hosts, so the
# Telegram report is sent even if every managed host is unreachable.
#
# `controller`, not `localhost`: the same machine and the same local connection,
# but IMPLICIT LOCALHOST IS NOT IN THE INVENTORY and therefore gets no
# group_vars — including openbao_addr and openbao_role_id, without which the
# secret cannot be fetched.
- name: Report update results to Telegram
  hosts: controller
  gather_facts: false
  vars:
    _report_hosts: "{{ groups['managed'] | default([]) }}"

  tasks:
    # Read from OpenBao (#2).
    #
    # No `apply:` with delegate_to/run_once here: this play already runs on a
    # single host, and that host is the controller.
    #
    # No openbao_read_field: all three values live in one secret, so read it
    # once as a dict. Naming a field per include cost one GET per field for the
    # same path — the AppRole login is reused across includes, the reads were
    # not — and left the three fields free to disagree if the secret were
    # rewritten between them.
    - name: Fetch the Telegram secret
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: telegram
        openbao_read_into: _telegram
      tags:
        - config

    # A whole-secret read has no field name to assert on, so the presence check
    # moves here. Without it a missing bot_token would arrive as an empty
    # string and the report would vanish with the play still green — the
    # failure mode of #117.
    #
    # updates_topic_id is deliberately not required: without it the report goes
    # to the group's General topic. `bao kv put` replaces a secret wholesale,
    # so that field is one careless write away from disappearing — tolerated
    # rather than required.
    - name: Assert the Telegram secret carries what the report needs
      ansible.builtin.assert:
        that:
          - _telegram.bot_token | default('') | length > 0
          - _telegram.chat_id | default('') | length > 0
        fail_msg: >-
          infra/telegram is missing bot_token or chat_id. Write the whole
          secret in one call: bao kv put replaces it wholesale, so a per-field
          write silently drops the other fields.
      tags:
        - config

    # Noteworthy = any failure/unreachable, any packages, or a reboot. A quiet
    # "all ok, nothing to do" report is still sent daily as a heartbeat, but
    # without a sound (disable_notification) — noise only when something happened.
    - name: Determine whether the report is noteworthy
      ansible.builtin.set_fact:
        update_noteworthy: >-
          {{ (_report_hosts | map('extract', hostvars)
              | map(attribute='update_status', default='missing')
              | reject('eq', 'ok') | list | length > 0)
             or (_report_hosts | map('extract', hostvars)
                 | map(attribute='update_packages', default=[])
                 | flatten | length > 0)
             or (_report_hosts | map('extract', hostvars)
                 | map(attribute='update_reboot_needed', default=false)
                 | select | list | length > 0) }}

    - name: Compose the Telegram update report
      ansible.builtin.set_fact:
        # HTML parse_mode (see notify_telegram): host names are bold, package
        # lines monospaced. All dynamic content is escaped (| e) so an odd
        # character in an apt error can't break the whole message. Hosts with
        # nothing to report are collapsed into a single "no updates" line.
        update_report: |-
          🖥 <b>Update report</b> — {{ _report_hosts | length }} host(s)
          {% set ns = namespace(quiet=[]) %}
          {% for h in _report_hosts %}
          {%- set hv = hostvars[h] %}
          {%- if hv.update_status | default('') == 'ok'
                and (hv.update_packages | default([]) | length == 0)
                and not (hv.update_reboot_needed | default(false)) %}
          {%- set ns.quiet = ns.quiet + [h] %}
          {%- endif %}
          {%- endfor %}
          {% if ns.quiet | length > 0 %}✅ {{ ns.quiet | join(', ') }} — no updates
          {% endif %}
          {%- for h in _report_hosts if h not in ns.quiet %}
          {%- set hv = hostvars[h] %}
          {% if hv.update_status | default('') == 'ok' -%}
          {% set pkgs = hv.update_packages | default([]) -%}
          {% set reboot_note = ' · 🔄 rebooted' if hv.update_rebooted | default(false)
               else (' · ⏳ reboot required (manual)' if hv.update_reboot_needed | default(false) else '') -%}
          📦 <b>{{ h }}</b>: {{ pkgs | length }} pkg(s){{ reboot_note }}
          {% for p in pkgs[:15] %}<code>   • {{ p | e }}</code>
          {% endfor %}{% if pkgs | length > 15 %}   • …and {{ pkgs | length - 15 }} more
          {% endif %}{% elif hv.update_status | default('') == 'failed' -%}
          ⚠️ <b>{{ h }}</b>: FAILED — {{ hv.update_error | default('unknown error') | e }}
          {% else -%}
          ❓ <b>{{ h }}</b>: no result (unreachable?)
          {% endif %}
          {%- endfor %}

    - name: Send the report to Telegram
      ansible.builtin.include_role:
        name: notify_telegram
      vars:
        notify_telegram_bot_token: "{{ _telegram.bot_token }}"
        notify_telegram_chat_id: "{{ _telegram.chat_id }}"
        notify_telegram_message_thread_id: "{{ _telegram.updates_topic_id | default('') }}"
        notify_telegram_message: "{{ update_report }}"
        notify_telegram_silent: "{{ not update_noteworthy }}"
        notify_telegram_parse_mode: HTML
      when: _report_hosts | length > 0
