---
# Ensure the Semaphore templates carry their survey-variable sets (issue #48) —
# Semaphore configuration as code, via its own REST API.
#
# Designed to run FROM Semaphore itself (an ad-hoc template with no survey):
# inside the Semaphore container its API is http://127.0.0.1:3000. Override
# semaphore_api_url for a run from elsewhere.
#
# The Semaphore API token comes from OpenBao (#2): infra/semaphore, field
# api_token. Create it once in the Semaphore UI (user menu -> API Tokens):
#
#   read -rs V && printf '%s' "$V" \
#     | docker exec -i openbao bao kv put infra/semaphore api_token=-
#
# The template must have the Variable Group carrying OPENBAO_SECRET_ID
# attached, or the read fails on its first assert.
#
# ONE playbook for ALL templates: semaphore_surveys maps a template name to the
# survey set it should carry, and the per-template work is included in a loop.
# Giving a new template its survey is a data edit here, not another playbook —
# which is the point, because the alternative is somebody adding the variable
# by hand in the UI and nothing recording that it exists.
#
# Idempotent per template (fetch-then-guard, CLAUDE.md §6): only variables
# MISSING by name are appended, and the PUT runs only when something is missing.

- name: Ensure Semaphore template survey variables
  hosts: controller
  gather_facts: false

  vars:
    semaphore_api_url: "http://127.0.0.1:3000"
    _api_headers:
      Authorization: "Bearer {{ _semaphore_api_token }}"

    # Template name -> desired survey set. type: "" is String, "secret" masks
    # the value. Existing variables always win — entries here only fill gaps.
    semaphore_surveys:

      "Provision Node":
        - name: node_ip
          title: Node IP
          description: >-
            Public IP of the freshly rented VPS (root + admin key).
            Used ONLY for SSH — the panel never sees it
          type: ""
          required: true
        - name: node_name
          title: Node name
          description: >-
            DNS-safe short name (lowercase letters, digits, hyphens; >=3 chars,
            e.g. pl-1). Becomes hostname, NetBird peer, panel node and Dockhand
            environment name
          type: ""
          required: true
        - name: node_profile
          title: Config profile
          description: >-
            Config profile name (e.g. Poland). Created automatically if missing
            — then Profile domain is required
          type: ""
          required: true
        - name: hawser_token
          title: Hawser token
          description: Dockhand edge token for this host's environment
          type: secret
          required: true
        - name: node_country
          title: Country code
          description: ISO-2 country code for the panel flag (e.g. PL)
          type: ""
          required: false
        - name: profile_domain
          title: Profile domain
          description: >-
            Reality domain / SNI (e.g. pl.example.com). Required only when the
            profile must be created (new country)
          type: ""
          required: false
        - name: node_address
          title: Node address override
          description: >-
            Address the panel connects to. Leave empty to use the mesh DNS name
            <node_name>.<netbird_dns_domain> (default)
          type: ""
          required: false
        - name: squad_name
          title: Squad name
          description: >-
            Internal squad for the profile's inbound. Required only when more
            than one squad exists
          type: ""
          required: false

      "DNS (encrypted resolver)":
        - name: dns_target
          title: Target
          description: >-
            Host or group to configure — one node (e.g. fi) or a group (lab,
            fleet). Required on purpose: the playbook falls back to the lab
            group when unset, and a run started from here should state what it
            touches rather than inherit it. The role edits the interfaces file
            and clears the link's resolver settings, so the blast radius is
            worth typing out
          type: ""
          required: true

  tasks:
    # Read the API token from OpenBao (#2). The vault entry stays in place as
    # the cold fallback until backups are real (#7): reverting this switch is
    # reverting the commit, not editing anything on a server.
    - name: Fetch the Semaphore API token
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: semaphore
        openbao_read_field: api_token
        openbao_read_into: _semaphore_api_token
      tags:
        - config

    - name: Fetch Semaphore projects
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/projects"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: projects_result
      # No no_log on the read-only GETs: responses carry no secrets (the token
      # travels in headers, which uri does not log), and censoring them made a
      # wrong project id undebuggable (#52).
      # Needed only for auto-discovery; skipped when the id is supplied.
      when: semaphore_project_id is not defined

    - name: Assert exactly one project exists
      ansible.builtin.assert:
        that:
          - projects_result.json | length == 1
        fail_msg: >-
          Expected exactly one Semaphore project, found
          {{ projects_result.json | length }} — pass -e semaphore_project_id
          to disambiguate.
      when: semaphore_project_id is not defined

    - name: Resolve the project id
      ansible.builtin.set_fact:
        _project_id: "{{ semaphore_project_id | default(projects_result.json[0].id) }}"

    # Fetched once, outside the loop: the list is the same for every template
    # and it is only used to resolve names to ids.
    - name: Fetch the project templates
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/templates"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: templates_result

    - name: Ensure each template's survey variables
      ansible.builtin.include_tasks: tasks/semaphore-survey-template.yml
      loop: "{{ semaphore_surveys | dict2items }}"
      loop_control:
        loop_var: _survey
        label: "{{ _survey.key }}"
      tags:
        - config
