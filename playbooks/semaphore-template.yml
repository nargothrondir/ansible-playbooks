---
# Ensure the Semaphore task templates exist — Semaphore configuration as code,
# through its own REST API, so a template is not something one person once
# clicked into being.
#
# Companion to semaphore-survey.yml, which fills in the survey variables of
# templates that already exist. This one creates them. They are deliberately
# separate: creating is a POST that must not fire twice, editing is a diff.
#
# Contract verified against Semaphore's source at v2.19.14 — the version we
# run, not the current release: POST /api/project/{id}/templates answers 201
# with the created record and accepts view_id with the rest of the template;
# POST /api/project/{id}/views takes project_id, title and position and answers
# 201; PUT on a template or a view replaces the whole record.
#
# Designed to run FROM Semaphore itself (an ad-hoc template with no survey):
# inside the container its API is http://127.0.0.1:3000. Override
# semaphore_api_url for a run from elsewhere. The template must have the
# Variable Group carrying OPENBAO_SECRET_ID attached, or the first read fails.
#
# EXISTING TEMPLATES KEEP THEIR SETTINGS. A template that is already there is
# left as it is, including settings that differ from what is declared below.
# Reconciling them needs a PUT and a field-by-field diff, and doing that in the
# same playbook would put every working template at risk of a bad comparison.
# If a template's settings need changing, change them deliberately.
#
# Two things are the exception, and only these two: the NAME and the VIEW (the
# tab it sits on). They are how the operator finds a template, they carry no
# behaviour, and they are the part that drifts when templates are made by hand
# — the UI was a name-sorted list of mixed conventions until they were declared
# here. A template is found by its declared name or by one of its `formerly`
# names, renamed to the declared one and moved to its view. The PUT carries the
# full object read back from the API, so nothing else about it changes
# (tasks/semaphore-template-place.yml).
#
# NAMES ARE "Object: action". The All tab sorts by name, so the prefix is what
# keeps a component's templates together there: "OpenBao: Back up" next to
# "OpenBao: Deploy", not at the other end of the alphabet.
#
# IDS ARE RESOLVED FROM NAMES. Numeric ids are local to one Semaphore instance
# and mean nothing in git; a rebuilt instance renumbers everything. Where a name
# is not given, the playbook takes the only candidate and asserts that there is
# exactly one — the same shape the project id already uses.

- name: Ensure the Semaphore task templates exist
  hosts: "{{ semaphore_template_target | default('controller') }}"
  gather_facts: false

  vars:
    semaphore_api_url: "http://127.0.0.1:3000"

    # Declared, not discovered. Semaphore holds TWO repository records — this
    # repository and the inventory one — so the "only candidate" fallback cannot
    # resolve it: the first run proved that by failing the assert rather than
    # pointing a template at whichever came back first. A template for a playbook
    # in THIS repository must use the record for THIS repository, which makes the
    # name a definition rather than a guess. Override if the record is renamed.
    semaphore_template_repository: "ansible-playbooks"

    _api_headers:
      Authorization: "Bearer {{ _semaphore_api_token }}"
      Content-Type: application/json

    # Name → what the template should be. Adding one is a data edit here.
    #
    # allow_override_args_in_task lets the operator pass CLI arguments at run
    # time, which is what makes `--limit <host>` possible. hawser.yml targets
    # every managed host, and a fleet-wide run recreates every agent at once —
    # fine for a label, wrong for anything else, and the choice belongs to
    # whoever presses the button rather than to this file.
    # The tabs, in the order they appear after Semaphore's own "All". A view is
    # looked up by title: nothing but this file names these four (§6), and the
    # title is what the operator sees. Views made by hand are left alone.
    semaphore_views:
      - Fleet    # routine work on every node at once
      - Nodes    # one node's life: provisioning and its protocols
      - Panel    # the control plane: OpenBao and Semaphore itself
      - Access   # SSH and certificates — rare, and careful

    semaphore_templates:

      # "Sync", not "Deploy" or "Upgrade": the run does three different jobs and
      # only one of them is a version bump. It delivers a changed compose, it
      # hands the agent a token that was just rotated, and it is how a stranded
      # agent is brought back. The role is idempotent, so the honest description
      # is that it makes the agent match what is declared — whatever that turns
      # out to mean on the day.
      #
      # First install is NOT one of the jobs in practice: a new node gets its
      # agent from provision-node.yml, and nobody reaches for this template to
      # build one.
      "Fleet: Sync Hawser":
        view: Fleet
        formerly: ["Sync Hawser"]
        playbook: playbooks/hawser.yml
        description: >-
          Bring the Hawser agent in line with what is declared — new compose,
          rotated token, or a stranded agent brought back. Set Limit to one host;
          without it every agent on the fleet is recreated at once.

      # The rotation half of the pair above, and the reason it needs an entry of
      # its own: dockhand-environment.yml is imported by provision-node.yml, so
      # until now it could only run as part of provisioning a new node. Replacing
      # ONE node's token had no button, and the header of that playbook has
      # documented the procedure since July as something nobody could perform.
      #
      # Limit stays EMPTY here, which is the opposite of "Fleet: Sync Hawser". This
      # playbook targets the controller and speaks only to the OpenBao and
      # Dockhand APIs; it never touches the node. A limit naming the node would
      # leave the play with no hosts.
      #
      # Rotation REVOKES the previous token, so the node is unmanaged from the
      # moment this finishes until "Fleet: Sync Hawser" hands the new one to the agent.
      # Traffic is unaffected — Hawser carries management, not user connections —
      # but the two runs belong together, one host at a time.
      "Node: Rotate Hawser token":
        view: Nodes
        formerly: ["Rotate Hawser token"]
        playbook: playbooks/dockhand-environment.yml
        description: >-
          Mint and issue a new Hawser token for one node, revoking the old one.
          Pass -e node_name=<host> -e dockhand_force_rotate=true in CLI args and
          leave Limit EMPTY. The node is unmanaged until "Fleet: Sync Hawser" is run for
          it with Limit <host>,controller — do one host at a time.

      # How a change to the NetBird SSH decision reaches nodes that are already
      # running. provision-node.yml applies it to a node it builds; everything
      # built earlier keeps what it joined with, and the root login decided in
      # #102 would otherwise need a rebuild per node.
      #
      # Limit must carry the controller, as for "Fleet: Sync Hawser": its play reads the
      # setup key, and without it the node play stops at its assert. A node whose
      # settings differ drops off the mesh for seconds while they are re-applied
      # — the playbook header explains why the run survives that.
      "Fleet: Sync NetBird":
        view: Fleet
        formerly: ["Sync NetBird"]
        playbook: playbooks/netbird.yml
        description: >-
          Bring each node's NetBird agent in line with the role — chiefly the
          SSH break-glass and root login through it. A node whose settings
          differ is off the mesh for a few seconds while they are re-applied.
          Leave Limit EMPTY for every node, or set <host>,controller for one.

      # The agent's role, re-applied to running nodes: provisioning installs it
      # on a new one, and this is how a change to the role — the update timer
      # first of all — reaches the ones already serving. Limit must carry the
      # controller: its play reads the hub credentials, and the node play
      # asserts they were read.
      "Fleet: Sync Beszel agent":
        view: Fleet
        formerly: ["Sync Beszel agent"]
        playbook: playbooks/beszel.yml
        description: >-
          Bring each node's Beszel agent in line with the role — registration
          in the hub, the systemd unit and the automatic update timer. Leave
          Limit EMPTY for every node, or set <host>,controller for one.

      # Targeting here is the playbook's own variable rather than --limit,
      # because apt-sources.yml chooses its hosts from apt_sources_target and
      # defaults to the lab group. A run with no arguments therefore cannot
      # reach the fleet, and widening it is a deliberate act typed at launch.
      "Fleet: Normalise apt sources":
        view: Fleet
        formerly: ["Normalise apt sources"]
        playbook: playbooks/apt-sources.yml
        description: >-
          Replace whatever apt arrangement the provider image shipped with one
          canonical deb822 source list. Defaults to the lab group; pass
          -e apt_sources_target=<host> in CLI args for one node at a time.

      # The only template here that can end with nobody able to reach a host,
      # and it is deliberately not folded into "SSH: Trust the fleet CA": that
      # one adds a credential, this one removes two.
      #
      # Limit is REQUIRED, and unlike the CA template it must NOT carry the
      # controller — nothing is read from OpenBao, because a lockdown needs no
      # secret. One host at a time, lab first, and open a NEW session to the
      # host before moving on: the reload does not drop the connection the run
      # is using, so a broken result stays invisible until the next login.
      "SSH: Lock down passwords":
        view: Access
        formerly: ["Lock down SSH authentication"]
        playbook: playbooks/ssh-lockdown.yml
        description: >-
          Turn off password authentication and password-based root login on a
          node. Set Limit to ONE host. The role refuses if root has no key,
          because there the password is root's only way in. Verify a fresh
          login before the next host.

      # Daily, and the hour is chosen: 08:00 UTC is an hour before the From-Git
      # stacks deploy, so the day's snapshot is of the state the day is about to
      # change, and a failure lands in the morning rather than overnight.
      #
      # Both fields stay EMPTY. The play targets controller and speaks only to
      # the OpenBao and Telegram APIs.
      #
      # A green run means a file reached the chat. It does NOT mean the backup
      # restores — that drill needs the unseal shares, which Semaphore does not
      # have and must never have.
      "OpenBao: Back up":
        view: Panel
        formerly: ["Back up OpenBao"]
        playbook: playbooks/openbao-backup.yml
        description: >-
          Snapshot OpenBao and send it to Telegram. Leave CLI args and Limit
          EMPTY. Proves an upload, not a restore — perform the drill in
          roles/openbao/README.md separately.

      # Phase 3 of the SSH CA: the first thing in that line of work that touches
      # a host. Additive — the node gains certificate logins and keeps
      # authorized_keys, so a failed certificate is not a lockout.
      #
      # Limit is REQUIRED and must carry the controller, like "Fleet: Sync Hawser" and
      # for the same reason: the CA key is read in a play targeting the
      # controller, and a limit without it produces a green run that installed
      # nothing. The playbook asserts rather than letting that pass.
      #
      # One host at a time, lab first, with a real certificate login in between.
      # A run of this is not proof that certificates work — only that sshd
      # merged the directive.
      "SSH: Trust the fleet CA":
        view: Access
        formerly: ["Trust the fleet SSH CA"]
        playbook: playbooks/ssh-ca-trust.yml
        description: >-
          Install the fleet CA as a trust anchor on a node, so it accepts
          certificates alongside the existing key. Set Limit to <host>,controller
          — one host at a time, and log in with a certificate before the next.

      # The only way to exercise the agent half of openbao-ssh-sign.yml, and the
      # reason it needs a template rather than a shell command: the playbook's
      # default mode reads the public key out of `ssh-add -L`, and that agent
      # exists only inside a Semaphore run. Semaphore starts one per task and
      # exports SSH_AUTH_SOCK (local_executor.go:882); from the panel shell there
      # is nothing to ask, and the playbook says so instead of guessing.
      #
      # Both fields stay EMPTY. The play targets controller through its own
      # ssh_sign_target default, speaks only to the OpenBao API, and writes the
      # certificate to /tmp inside the container — a limit naming a node would
      # leave it with no hosts, and there is nothing to pass in CLI args.
      #
      # Nothing is changed by a run of this. The certificate it produces is
      # public by construction and inert until a host trusts the CA, which no
      # host does yet. It is a probe, kept because the next phase edits sshd on
      # a live node and this is what says the credential side already works.
      "SSH: Sign certificate (test)":
        view: Access
        formerly: ["Sign SSH certificate (test)"]
        playbook: playbooks/openbao-ssh-sign.yml
        description: >-
          Sign Semaphore's own SSH key with the fleet CA and print what came
          back. Leave CLI args and Limit EMPTY. Changes nothing: no host trusts
          the CA yet, so the certificate is a probe of the OpenBao side.

      # How a node that already serves Reality TCP gains xHTTP next to it
      # (archive #42). provision-node.yml cannot do it: it builds a node from a
      # root password. This runs the three panel/Dockhand steps of that
      # pipeline with node_xhttp=true, and they only ever ADD.
      #
      # Limit stays EMPTY: every play targets the controller. One node at a
      # time, with a client connecting through the new entry before the next.
      "Node: Enable xHTTP":
        view: Nodes
        formerly: ["Enable xHTTP"]
        playbook: playbooks/enable-xhttp.yml
        description: >-
          Add VLESS over xHTTP to one existing node, next to Reality TCP — the
          profile inbound, the subscription host and the Angie location. Fill
          the survey with the node's name, profile and country; leave Limit
          EMPTY. Users of that node reconnect once when Xray restarts.

      # The same for Hysteria2, with one play on the node itself first: it
      # checks that remnanode can read the node's certificate (a TLS inbound
      # Xray cannot load stops every protocol on the node) and opens UDP 443.
      # Limit stays EMPTY — that play targets the node by node_name.
      "Node: Enable Hysteria2":
        view: Nodes
        formerly: ["Enable Hysteria2"]
        playbook: playbooks/enable-hysteria2.yml
        description: >-
          Add Hysteria2 (UDP 443) to one existing node, next to Reality TCP and
          xHTTP — checks the node's certificate, opens the port, adds the
          profile inbound and the subscription host. Fill the survey with the
          node's name, profile and country; leave Limit EMPTY. Users of that
          node reconnect once when Xray restarts.

      # The one-off move of a profile's inbounds to the <CC>-<protocol> tag
      # scheme. A rename re-creates the inbound, so the run cuts the profile's
      # users off for seconds while it re-binds squads, nodes and hosts — one
      # profile per run, and the snapshot it prints is how a failed run is
      # repaired (migrate_restore in CLI args). Limit stays EMPTY.
      "Node: Migrate inbound tags":
        view: Nodes
        formerly: ["Migrate inbound tags"]
        playbook: playbooks/migrate-inbound-tags.yml
        description: >-
          Rename ONE config profile's inbounds to <CC>-VLESS-TCP-REALITY /
          <CC>-VLESS-XHTTP-TLS and re-bind squads, nodes and hosts. Its users
          reconnect once. Leave Limit EMPTY. A failed run prints a snapshot —
          re-run with -e 'migrate_restore=<that JSON>' to re-bind.

      # Read-only: every task is a GET, the run reports changed=0, and it is
      # safe on a schedule. What it checks is written down in the
      # remnawave-cookbook skill (audit.md). Both fields stay EMPTY. Profiles
      # deliberately left on old tags go in audit_legacy_profiles (by name)
      # (group_vars/control) and are reported as warnings, not errors.
      "Fleet: Audit":
        view: Fleet
        formerly: ["Audit fleet"]
        playbook: playbooks/audit-fleet.yml
        description: >-
          Check every profile, inbound, host, node and node stack against the
          REALITY + xHTTP invariants — tags, squad/node/host bindings, host
          settings, nodes switched on, XHTTP_PATH where xHTTP is served.
          Read-only. Leave CLI args and Limit EMPTY.

      # This playbook declares itself, and that is not a curiosity — it is what
      # ends the borrowing. Until now the only way to run it was to repoint an
      # existing template at it, which left that template named for a job it was
      # no longer doing. One run from a borrowed template creates this entry;
      # after that the borrowed one goes back to its own playbook and nothing
      # has to be repointed again.
      #
      # The first template still cannot come from here — something has to run
      # this playbook the first time. That is the irreducible seed, and it is the
      # same shape as the Hawser agent, which also cannot deliver itself.
      "Semaphore: Sync templates":
        view: Panel
        formerly: ["Sync Templates"]
        playbook: playbooks/semaphore-template.yml
        description: >-
          Create the task templates and views declared in this playbook that
          Semaphore does not have yet, and give existing templates their
          declared name and view. Nothing else about an existing template is
          changed. Leave CLI args and Limit EMPTY; run Sync surveys after it.

      # The templates below were made by hand before this file declared them.
      # Declaring them is what lets a rebuilt Semaphore get them back, and it is
      # how their old names are found and replaced. Their settings on the live
      # instance are left as they are, like every other existing template.

      # The daily run, on its Semaphore schedule. serial: one host at a time,
      # and an unreachable host is skipped rather than ending the run.
      "Fleet: Update servers":
        view: Fleet
        formerly: ["Update servers"]
        playbook: playbooks/update.yml
        description: >-
          Update packages on every managed host, one host at a time, and report
          the result to Telegram. Runs daily on its schedule. Leave Limit EMPTY
          for the fleet, or set one host.

      # The survey (dns_target) comes from semaphore-survey.yml.
      "Fleet: Encrypted DNS":
        view: Fleet
        formerly: ["DNS (encrypted resolver)"]
        playbook: playbooks/dns.yml
        description: >-
          Apply encrypted DNS (systemd-resolved, DNS over TLS) to a node the
          pipeline did not build. Fill dns_target in the survey. Stops on a node
          whose containers are already running; see roles/dns/README.md.

      # One template for the common role, whatever the target. It replaces two
      # hand-made ones that each baked a target into their arguments — one the
      # lab group, which is empty now, the other the zram swap roll-out, long
      # finished. common.yml was written for exactly this: the target is a
      # variable, and the survey (semaphore-survey.yml) makes it required, so
      # a run states what it touches.
      "Fleet: Apply common":
        view: Fleet
        playbook: playbooks/common.yml
        description: >-
          Re-apply the common baseline (swap, sysctls, packages, journald) to
          the target given in the survey: one node, a group, or fleet.
          Add --check --diff in CLI args for a dry run first. Leave Limit EMPTY.

      # The survey (node name, admin address, profile, country…) comes from
      # semaphore-survey.yml; the header of provision-node.yml documents it.
      "Node: Provision":
        view: Nodes
        formerly: ["Provision Node"]
        playbook: playbooks/provision-node.yml
        description: >-
          Build a new node from a freshly rented VPS: base system, mesh, stack,
          panel node and monitoring. Fill the survey; leave Limit EMPTY.

      # Targets `panel` over SSH, which is why it runs from here and not from
      # the panel shell: Semaphore holds the key.
      "OpenBao: Deploy":
        view: Panel
        formerly: ["OpenBao Deploy"]
        playbook: playbooks/openbao.yml
        description: >-
          Deploy or upgrade OpenBao on the panel. Recreating the container
          SEALS the store: unseal it afterwards with `docker exec -it openbao
          bao operator unseal`, once per share up to the threshold. Every
          playbook that reads a secret fails until then.

      "OpenBao: Verify":
        view: Panel
        formerly: ["OpenBao Verify"]
        playbook: playbooks/openbao-verify.yml
        description: >-
          Prove the secret-delivery chain from inside Semaphore: AppRole login,
          token, and a KV read of the self-test value. Leave CLI args and Limit
          EMPTY.

      "Semaphore: Sync surveys":
        view: Panel
        formerly: ["Sync Survey"]
        playbook: playbooks/semaphore-survey.yml
        description: >-
          Bring every template's survey variables to the set declared in
          semaphore-survey.yml. Run it after Sync templates. Leave CLI args and
          Limit EMPTY.

      "Semaphore: Switch inventory repo":
        view: Panel
        formerly: ["Inventory Repo Switch"]
        playbook: playbooks/semaphore-inventory-repo.yml
        description: >-
          Report-only without arguments: prints the project's repositories,
          inventories and keys. Pass the variables described in the playbook
          header to point the inventory at the private repository.

      "SSH: Mesh check":
        view: Access
        formerly: ["Mesh SSH Check"]
        playbook: playbooks/mesh-ssh-check.yml
        description: >-
          Check that the automation user reaches hosts over the NetBird mesh by
          name. Pass -e mesh_targets=node-a,node-b in CLI args.

  tasks:
    - name: Fetch the Semaphore API token
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: semaphore
        openbao_read_field: api_token
        openbao_read_into: _semaphore_api_token
      tags:
        - config

    # No no_log on the read-only GETs: the responses carry no secrets, the token
    # travels in headers which uri does not log, and censoring them once made a
    # wrong id undebuggable (#52).
    #
    # The OpenAPI spec marks `sort` and `order` required on the templates GET;
    # the running implementation accepts the call without them, which is what
    # semaphore-survey.yml has been doing since it was written. Following the
    # working call rather than the stricter document.
    - name: Fetch Semaphore projects
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/projects"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _projects
      changed_when: false
      when: semaphore_project_id is not defined
      tags:
        - config

    - name: Assert exactly one project exists
      ansible.builtin.assert:
        that:
          - _projects.json | length == 1
        fail_msg: >-
          Expected exactly one Semaphore project, found
          {{ _projects.json | length }} — pass -e semaphore_project_id
          to disambiguate.
      when: semaphore_project_id is not defined
      tags:
        - config

    - name: Resolve the project id
      ansible.builtin.set_fact:
        _project_id: "{{ semaphore_project_id | default(_projects.json[0].id) }}"
      tags:
        - config

    - name: Fetch the pieces a template has to point at
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/{{ item }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _pieces
      changed_when: false
      loop:
        - inventory
        - repositories
        - environment
      loop_control:
        label: "{{ item }}"
      tags:
        - config

    # One name per collection, not one per template: every playbook in this
    # repository runs against the same inventory, repository and variable group,
    # and a per-template override would be complexity with no case behind it.
    - name: Resolve the inventory, repository and variable group
      ansible.builtin.set_fact:
        _inventory_id: >-
          {{ ((_pieces.results[0].json | selectattr('name', 'equalto', semaphore_template_inventory) | list | first | default({}))
              if semaphore_template_inventory is defined
              else (_pieces.results[0].json | first | default({}))).id | default('') }}
        _repository_id: >-
          {{ ((_pieces.results[1].json | selectattr('name', 'equalto', semaphore_template_repository) | list | first | default({}))
              if semaphore_template_repository is defined
              else (_pieces.results[1].json | first | default({}))).id | default('') }}
        _environment_id: >-
          {{ ((_pieces.results[2].json | selectattr('name', 'equalto', semaphore_template_environment) | list | first | default({}))
              if semaphore_template_environment is defined
              else (_pieces.results[2].json | first | default({}))).id | default('') }}
      tags:
        - config

    # Two failures, and they are different. Taking "the only one" is safe only
    # when there IS one — so the count is checked for whatever was resolved by
    # falling back. A NAMED record that does not exist resolves to nothing, which
    # is why the ids are checked as well: without that, an id of '' would be sent
    # to the API and come back as a puzzling 400.
    - name: Assert every piece resolved to exactly one record
      ansible.builtin.assert:
        that:
          - semaphore_template_inventory is defined or (_pieces.results[0].json | length) == 1
          - semaphore_template_repository is defined or (_pieces.results[1].json | length) == 1
          - semaphore_template_environment is defined or (_pieces.results[2].json | length) == 1
          - _inventory_id | string | length > 0
          - _repository_id | string | length > 0
          - _environment_id | string | length > 0
        fail_msg: >-
          Could not point the template at exactly one inventory, repository and
          variable group.
          Found {{ _pieces.results[0].json | length }} inventories,
          {{ _pieces.results[1].json | length }} repositories,
          {{ _pieces.results[2].json | length }} variable groups; resolved ids
          '{{ _inventory_id }}' / '{{ _repository_id }}' / '{{ _environment_id }}'.
          An empty id means the NAME given does not exist in Semaphore — check
          semaphore_template_repository (default "{{ semaphore_template_repository }}")
          against the repository list. A count above one with no name given means
          the fallback cannot choose: pass
          -e semaphore_template_inventory=... / _repository=... / _environment=...
      tags:
        - config

    # ---- Views -------------------------------------------------------------
    - name: Fetch the views
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/views"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _views
      changed_when: false
      tags:
        - config

    # Position is the list index plus one: Semaphore's own "All" view (type
    # `all`) sits in front of them.
    - name: Create the missing views
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/views"
        method: POST
        headers: "{{ _api_headers }}"
        body_format: json
        body: >-
          {{ {'project_id': _project_id | int,
              'title': item,
              'position': semaphore_views.index(item) + 1} }}
        status_code: [201]
      register: _views_created
      loop: "{{ semaphore_views }}"
      when: item not in (_views.json | default([]) | map(attribute='title') | list)
      changed_when: _views_created.status == 201
      tags:
        - config

    - name: Fetch the views again, with the new ones
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/views"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _views
      changed_when: false
      tags:
        - config

    # A title that exists twice cannot be resolved to one view, and taking the
    # first would spread templates over two tabs of the same name.
    - name: Assert every declared view exists exactly once
      ansible.builtin.assert:
        that:
          - (_views.json | selectattr('title', 'equalto', item) | list | length) == 1
        fail_msg: >-
          View "{{ item }}" matched
          {{ _views.json | selectattr('title', 'equalto', item) | list | length }}
          views; exactly one is needed. Rename or remove the duplicate in the UI.
        quiet: true
      loop: "{{ semaphore_views }}"
      tags:
        - config

    - name: Resolve each declared view to its id
      ansible.builtin.set_fact:
        _view_ids: "{{ _views.json | items2dict(key_name='title', value_name='id') }}"
      tags:
        - config

    # ---- Existing templates: name and view --------------------------------
    - name: Fetch the existing templates
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/templates"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _templates
      changed_when: false
      tags:
        - config

    # One entry per declared template, with every existing template that
    # carries its declared name or a former one. More than one match means an
    # old and a new copy both exist, and renaming either would leave two
    # templates with one name.
    - name: Match each declared template to the one that exists
      ansible.builtin.set_fact:
        _placement: >-
          {{ _placement | default([]) + [{
               'key': item.key,
               'view': _view_ids[item.value.view],
               'matches': _templates.json | default([])
                          | selectattr('name', 'in', [item.key] + item.value.formerly | default([]))
                          | list}] }}
      loop: "{{ semaphore_templates | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      tags:
        - config

    - name: Assert no declared template exists twice
      ansible.builtin.assert:
        that:
          - (item.matches | length) <= 1
        fail_msg: >-
          "{{ item.key }}" matches {{ item.matches | map(attribute='name') | join(', ') }}
          — an old and a new copy both exist. Delete the one that should not be
          there, then run this again.
        quiet: true
      loop: "{{ _placement }}"
      loop_control:
        label: "{{ item.key }}"
      tags:
        - config

    # Fetch-then-guard: only a template whose name or view differs is touched.
    - name: Give existing templates their declared name and view
      ansible.builtin.include_tasks: tasks/semaphore-template-place.yml
      vars:
        _place:
          id: "{{ item.matches[0].id }}"
          key: "{{ item.key }}"
          view: "{{ item.view }}"
      loop: "{{ _placement | selectattr('matches') | list }}"
      loop_control:
        label: "{{ item.key }}"
      when: >-
        item.matches[0].name != item.key
        or (item.matches[0].view_id | default(0, true) | int) != (item.view | int)
      tags:
        - config

    # ---- Missing templates -------------------------------------------------
    # Fetch-then-guard (§6): created only when neither the name nor a former
    # name exists. The POST is not idempotent — a second one would make a
    # duplicate template with the same name and a different id, and Semaphore
    # accepts that quite happily. `create: false` entries are placed, never
    # created.
    - name: Create the missing templates
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/templates"
        method: POST
        headers: "{{ _api_headers }}"
        body_format: json
        body: >-
          {{ {'project_id': _project_id | int,
              'inventory_id': _inventory_id | int,
              'repository_id': _repository_id | int,
              'environment_id': _environment_id | int,
              'name': item.key,
              'playbook': semaphore_templates[item.key].playbook,
              'description': semaphore_templates[item.key].description | default(''),
              'app': 'ansible',
              'git_branch': semaphore_templates[item.key].git_branch | default(''),
              'arguments': '[]',
              'allow_override_args_in_task': semaphore_templates[item.key].allow_override_args | default(true),
              'view_id': item.view | int,
              'type': ''} }}
        status_code: [201]
      register: _created
      loop: "{{ _placement | rejectattr('matches') | list }}"
      loop_control:
        label: "{{ item.key }}"
      when: semaphore_templates[item.key].create | default(true) | bool
      changed_when: _created.status == 201
      tags:
        - config

    - name: Report what was created, renamed and left alone
      ansible.builtin.debug:
        msg: >-
          {{ semaphore_templates | length }} declared in {{ semaphore_views | length }} views.
          Created: {{ _placement | rejectattr('matches') | map(attribute='key') | join(', ') | default('none', true) }}.
          Renamed: {{ _placement | selectattr('matches') | map(attribute='matches') | map('first')
                      | map(attribute='name') | reject('in', semaphore_templates.keys() | list)
                      | join(', ') | default('none', true) }}.
          Not declared here, left as they are:
          {{ _templates.json | default([]) | map(attribute='name')
             | reject('in', semaphore_templates.keys() | list)
             | reject('in', semaphore_templates.values() | map(attribute='formerly', default=[]) | flatten)
             | join(', ') | default('none', true) }}.
          Settings of existing templates were not changed — only name and view.
      tags:
        - debug
        - config
