---
# Ensure the Semaphore task templates exist — Semaphore configuration as code,
# through its own REST API, so a template is not something one person once
# clicked into being.
#
# Companion to semaphore-survey.yml, which fills in the survey variables of
# templates that already exist. This one creates them. They are deliberately
# separate: creating is a POST that must not fire twice, editing is a diff.
#
# Contract verified against Semaphore's OpenAPI at v2.19.7 — the version we run,
# not the current release: POST /api/project/{id}/templates answers 201 with the
# created record, and TemplateRequest carries project_id, inventory_id,
# repository_id, environment_id, name, playbook, app and git_branch.
#
# Designed to run FROM Semaphore itself (an ad-hoc template with no survey):
# inside the container its API is http://127.0.0.1:3000. Override
# semaphore_api_url for a run from elsewhere. The template must have the
# Variable Group carrying OPENBAO_SECRET_ID attached, or the first read fails.
#
# EXISTING TEMPLATES ARE NOT TOUCHED. A template whose name is already there is
# left exactly as it is, including settings that differ from what is declared
# below. Reconciling them needs a PUT and a field-by-field diff, and doing that
# in the same playbook would put every working template at risk of a bad
# comparison. If a template needs changing, change it deliberately.
#
# IDS ARE RESOLVED FROM NAMES. Numeric ids are local to one Semaphore instance
# and mean nothing in git; a rebuilt instance renumbers everything. Where a name
# is not given, the playbook takes the only candidate and asserts that there is
# exactly one — the same shape the project id already uses.

- name: Ensure the Semaphore task templates exist
  hosts: "{{ semaphore_template_target | default('controller') }}"
  gather_facts: false

  vars:
    semaphore_api_url: "http://127.0.0.1:3000"

    # Declared, not discovered. Semaphore holds TWO repository records — this
    # repository and the inventory one — so the "only candidate" fallback cannot
    # resolve it: the first run proved that by failing the assert rather than
    # pointing a template at whichever came back first. A template for a playbook
    # in THIS repository must use the record for THIS repository, which makes the
    # name a definition rather than a guess. Override if the record is renamed.
    semaphore_template_repository: "ansible-playbooks"

    _api_headers:
      Authorization: "Bearer {{ _semaphore_api_token }}"
      Content-Type: application/json

    # Name → what the template should be. Adding one is a data edit here.
    #
    # allow_override_args_in_task lets the operator pass CLI arguments at run
    # time, which is what makes `--limit <host>` possible. hawser.yml targets
    # every managed host, and a fleet-wide run recreates every agent at once —
    # fine for a label, wrong for anything else, and the choice belongs to
    # whoever presses the button rather than to this file.
    semaphore_templates:

      # "Sync", not "Deploy" or "Upgrade": the run does three different jobs and
      # only one of them is a version bump. It delivers a changed compose, it
      # hands the agent a token that was just rotated, and it is how a stranded
      # agent is brought back. The role is idempotent, so the honest description
      # is that it makes the agent match what is declared — whatever that turns
      # out to mean on the day.
      #
      # First install is NOT one of the jobs in practice: a new node gets its
      # agent from provision-node.yml, and nobody reaches for this template to
      # build one.
      "Sync Hawser":
        playbook: playbooks/hawser.yml
        description: >-
          Bring the Hawser agent in line with what is declared — new compose,
          rotated token, or a stranded agent brought back. Set Limit to one host;
          without it every agent on the fleet is recreated at once.

      # Targeting here is the playbook's own variable rather than --limit,
      # because apt-sources.yml chooses its hosts from apt_sources_target and
      # defaults to the lab group. A run with no arguments therefore cannot
      # reach the fleet, and widening it is a deliberate act typed at launch.
      "Normalise apt sources":
        playbook: playbooks/apt-sources.yml
        description: >-
          Replace whatever apt arrangement the provider image shipped with one
          canonical deb822 source list. Defaults to the lab group; pass
          -e apt_sources_target=<host> in CLI args for one node at a time.

      # This playbook declares itself, and that is not a curiosity — it is what
      # ends the borrowing. Until now the only way to run it was to repoint an
      # existing template at it, which left that template named for a job it was
      # no longer doing. One run from a borrowed template creates this entry;
      # after that the borrowed one goes back to its own playbook and nothing
      # has to be repointed again.
      #
      # The first template still cannot come from here — something has to run
      # this playbook the first time. That is the irreducible seed, and it is the
      # same shape as the Hawser agent, which also cannot deliver itself.
      "Sync Templates":
        playbook: playbooks/semaphore-template.yml
        description: >-
          Create any task template declared in this playbook that Semaphore does
          not have yet. Existing templates are never modified — change one
          deliberately if it needs changing.

  tasks:
    - name: Fetch the Semaphore API token
      ansible.builtin.include_tasks: tasks/openbao-read.yml
      vars:
        openbao_read_path: semaphore
        openbao_read_field: api_token
        openbao_read_into: _semaphore_api_token
      tags:
        - config

    # No no_log on the read-only GETs: the responses carry no secrets, the token
    # travels in headers which uri does not log, and censoring them once made a
    # wrong id undebuggable (#52).
    #
    # The OpenAPI spec marks `sort` and `order` required on the templates GET;
    # the running implementation accepts the call without them, which is what
    # semaphore-survey.yml has been doing since it was written. Following the
    # working call rather than the stricter document.
    - name: Fetch Semaphore projects
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/projects"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _projects
      changed_when: false
      when: semaphore_project_id is not defined
      tags:
        - config

    - name: Assert exactly one project exists
      ansible.builtin.assert:
        that:
          - _projects.json | length == 1
        fail_msg: >-
          Expected exactly one Semaphore project, found
          {{ _projects.json | length }} — pass -e semaphore_project_id
          to disambiguate.
      when: semaphore_project_id is not defined
      tags:
        - config

    - name: Resolve the project id
      ansible.builtin.set_fact:
        _project_id: "{{ semaphore_project_id | default(_projects.json[0].id) }}"
      tags:
        - config

    - name: Fetch the pieces a template has to point at
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/{{ item }}"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _pieces
      changed_when: false
      loop:
        - inventory
        - repositories
        - environment
      loop_control:
        label: "{{ item }}"
      tags:
        - config

    # One name per collection, not one per template: every playbook in this
    # repository runs against the same inventory, repository and variable group,
    # and a per-template override would be complexity with no case behind it.
    - name: Resolve the inventory, repository and variable group
      ansible.builtin.set_fact:
        _inventory_id: >-
          {{ ((_pieces.results[0].json | selectattr('name', 'equalto', semaphore_template_inventory) | list | first | default({}))
              if semaphore_template_inventory is defined
              else (_pieces.results[0].json | first | default({}))).id | default('') }}
        _repository_id: >-
          {{ ((_pieces.results[1].json | selectattr('name', 'equalto', semaphore_template_repository) | list | first | default({}))
              if semaphore_template_repository is defined
              else (_pieces.results[1].json | first | default({}))).id | default('') }}
        _environment_id: >-
          {{ ((_pieces.results[2].json | selectattr('name', 'equalto', semaphore_template_environment) | list | first | default({}))
              if semaphore_template_environment is defined
              else (_pieces.results[2].json | first | default({}))).id | default('') }}
      tags:
        - config

    # Two failures, and they are different. Taking "the only one" is safe only
    # when there IS one — so the count is checked for whatever was resolved by
    # falling back. A NAMED record that does not exist resolves to nothing, which
    # is why the ids are checked as well: without that, an id of '' would be sent
    # to the API and come back as a puzzling 400.
    - name: Assert every piece resolved to exactly one record
      ansible.builtin.assert:
        that:
          - semaphore_template_inventory is defined or (_pieces.results[0].json | length) == 1
          - semaphore_template_repository is defined or (_pieces.results[1].json | length) == 1
          - semaphore_template_environment is defined or (_pieces.results[2].json | length) == 1
          - _inventory_id | string | length > 0
          - _repository_id | string | length > 0
          - _environment_id | string | length > 0
        fail_msg: >-
          Could not point the template at exactly one inventory, repository and
          variable group.
          Found {{ _pieces.results[0].json | length }} inventories,
          {{ _pieces.results[1].json | length }} repositories,
          {{ _pieces.results[2].json | length }} variable groups; resolved ids
          '{{ _inventory_id }}' / '{{ _repository_id }}' / '{{ _environment_id }}'.
          An empty id means the NAME given does not exist in Semaphore — check
          semaphore_template_repository (default "{{ semaphore_template_repository }}")
          against the repository list. A count above one with no name given means
          the fallback cannot choose: pass
          -e semaphore_template_inventory=... / _repository=... / _environment=...
      tags:
        - config

    - name: Fetch the existing templates
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/templates"
        method: GET
        headers: "{{ _api_headers }}"
        status_code: [200]
      register: _templates
      changed_when: false
      tags:
        - config

    # A template with no Vault attached cannot read an encrypted group_vars file,
    # and both group_vars/fleet and group_vars/control hold one. The first
    # templates this playbook created therefore came out broken — they ran until
    # the first play and died on "Attempting to decrypt but no vault secrets
    # found".
    #
    # Copied from a template that already works rather than resolved from the
    # Key Store, because the key's name and id are facts about this Semaphore
    # instance and mean nothing in git. Whatever the working templates use, new
    # ones get. The id is dropped: it identifies that template's own vault
    # record, and sending it back would point the new template at a row that
    # belongs to another.
    - name: Take the vault configuration from a template that already has one
      ansible.builtin.set_fact:
        _vault_src: >-
          {{ (_templates.json | default([])
              | selectattr('vaults', 'defined') | selectattr('vaults', 'truthy')
              | list | first | default({})).vaults | default([]) | first | default({}) }}
      tags:
        - config

    - name: Build the vault block for new templates
      ansible.builtin.set_fact:
        _template_vaults: >-
          {{ [ {'name': _vault_src.name | default('default'),
                'type': _vault_src.type | default('password'),
                'vault_key_id': _vault_src.vault_key_id} ]
             if _vault_src.vault_key_id is defined else [] }}
      tags:
        - config

    # Refusing here is the point: creating a template that cannot decrypt is
    # worse than creating none, because it looks finished and fails at the first
    # play of every run.
    - name: Assert a vault configuration was found to copy
      ansible.builtin.assert:
        that:
          - _template_vaults | length > 0
        fail_msg: >-
          No existing template carries a Vault, so a new one would be created
          unable to read the encrypted group_vars — which is how the first pair
          came out broken. Attach the Vault to one template by hand and run this
          again; every template made from then on inherits it.
      when: semaphore_templates | length > 0
      tags:
        - config

    # Fetch-then-guard (§6): created only when the name is absent. The POST is
    # not idempotent — a second one would make a duplicate template with the same
    # name and a different id, and Semaphore accepts that quite happily.
    - name: Create the missing templates
      ansible.builtin.uri:
        url: "{{ semaphore_api_url }}/api/project/{{ _project_id }}/templates"
        method: POST
        headers: "{{ _api_headers }}"
        body_format: json
        body: >-
          {{ {'project_id': _project_id | int,
              'inventory_id': _inventory_id | int,
              'repository_id': _repository_id | int,
              'environment_id': _environment_id | int,
              'name': item.key,
              'playbook': item.value.playbook,
              'description': item.value.description | default(''),
              'app': 'ansible',
              'git_branch': item.value.git_branch | default(''),
              'arguments': '[]',
              'allow_override_args_in_task': item.value.allow_override_args | default(true),
              'vaults': _template_vaults,
              'type': ''} }}
        status_code: [201]
      loop: "{{ semaphore_templates | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key not in (_templates.json | default([]) | map(attribute='name') | list)
      changed_when: item.key not in (_templates.json | default([]) | map(attribute='name') | list)
      tags:
        - config

    - name: Report which templates were created
      ansible.builtin.debug:
        msg: >-
          {{ semaphore_templates.keys() | list | length }} declared;
          created: {{ semaphore_templates.keys() | difference(_templates.json | default([]) | map(attribute='name') | list) | join(', ') | default('none', true) }};
          already present: {{ semaphore_templates.keys() | intersect(_templates.json | default([]) | map(attribute='name') | list) | join(', ') | default('none', true) }}.
          Existing templates are never modified — change one deliberately if it
          needs changing.
      tags:
        - debug
        - config
