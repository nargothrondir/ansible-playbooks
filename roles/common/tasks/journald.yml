---
# Cap the systemd journal. Left alone, journald takes up to 10% of the
# filesystem (at most 4 GiB): on kz-1's 10 GB disk that was 850 MB of a 76%-full
# root — more than every container log on the host put together. A drop-in
# rather than an edit of journald.conf, so the package keeps owning its file.
#
# Kept in its own file because update.yml includes it too (tasks_from): the
# daily run is how hosts built before the cap existed catch up, and how a hand
# edit gets put back.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - config
    - common
    - journald

- name: Cap the size of the systemd journal
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — roles/common. Do not edit by hand.
      [Journal]
      SystemMaxUse={{ common_journald_max_use }}
    dest: /etc/systemd/journald.conf.d/50-ansible-size.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart journald
  tags:
    - config
    - common
    - journald
