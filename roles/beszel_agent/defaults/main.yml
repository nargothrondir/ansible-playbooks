---
# Beszel monitoring agent (binary + systemd), adopting the existing on-node
# install. The agent dials the hub over WebSocket (HUB_URL + TOKEN), so it opens
# no inbound port. https://beszel.dev

# Bootstrap binary version. Installed ONLY if the binary is absent — Beszel
# self-updates thereafter, so the role must not re-pin and fight it.
beszel_agent_version: "0.18.7"
beszel_agent_arch: amd64
beszel_agent_user: beszel
beszel_agent_dir: /opt/beszel-agent
beszel_agent_port: 45876

# Hub the agent connects to (outgoing WebSocket). REQUIRED — set it in the
# inventory (group_vars), not here: a real hostname in a role default is an
# infrastructure tell, and this repository is headed for publication (#68).
# Empty by default so a missing value fails loudly instead of producing
# nonsense URLs deep inside the registration tasks.
beszel_agent_hub_url: ""

# Add the agent user to the docker group so it can read /var/run/docker.sock for
# per-container stats. Set false on hosts without Docker.
beszel_agent_docker_group: true

# Optional EXTRA_FILESYSTEMS (e.g. "sdb") — extra disks/partitions to monitor.
beszel_agent_extra_filesystems: ""

# The HUB's public key (ssh-ed25519 ...) — the agent verifies the hub's identity
# with it. Auto-fetched from the hub (/api/beszel/info) during registration; set
# it manually only if you disable beszel_agent_register.
beszel_agent_key: ""

# Per-node registration token. Left empty here: when beszel_agent_register is
# true the role obtains it from the hub API per node (see register.yml). Set it
# yourself (host_vars/vault) only if you disable auto-registration.
beszel_agent_token: ""

# --- Auto-registration via the hub API (PocketBase) -------------------------
# The role registers each node in the hub and reads/creates its per-node token,
# so there is no manual UI step and no per-node token to vault. Superuser
# credentials + the owner (dashboard) user email are required for this.
beszel_agent_register: true
beszel_agent_admin_email: "{{ vault_beszel_admin_email | default('') }}"
beszel_agent_admin_password: "{{ vault_beszel_admin_password | default('') }}"
beszel_agent_owner_email: ""                        # dashboard owner; empty = the sole/first user
beszel_agent_system_name: "{{ inventory_hostname }}"   # system name in the hub
beszel_agent_system_host: "{{ inventory_hostname }}"   # display host (WebSocket = nominal)
