---
# apt upgrade strategy. "dist" maps to `apt full-upgrade` (handles
# dependency and kernel changes). Use "safe" to avoid package removals.
upgrade_apt_type: dist

# Remove automatically-installed packages that are no longer required.
upgrade_autoremove: true

# Purge configuration files when autoremoving packages.
upgrade_autoremove_purge: true

# Clear downloaded .deb files from /var/cache/apt/archives after the upgrade.
# apt keeps every package it has ever fetched there otherwise.
upgrade_clean_cache: true

# Reuse the apt cache if it was refreshed within this many seconds.
upgrade_cache_valid_time: 3600

# Seconds each apt task waits for the dpkg lock before failing. The module's own
# default is 60, shorter than a routine apt-daily run that happens to start
# mid-play (see tasks/main.yml).
upgrade_lock_timeout: 900

# Packages this host must NEVER upgrade unattended, held with dpkg selections.
#
# The control plane cannot safely update the things it is running on. Semaphore
# executes ansible-playbook inside a container on the panel; `docker-ce`'s
# postinst restarts the daemon, which kills that container and the play with
# it. The task neither fails nor finishes — the run just stops existing, with
# no PLAY RECAP and no Telegram report (#83). The reboot variant of the same
# hazard is already handled by upgrade_reboot: false on that host (#52).
#
# Empty everywhere by default: a hold is a promise to update the package by
# hand, and making that promise for a host nobody watches is worse than the
# restart it prevents. Set it per host in the inventory, and see the report
# below — a held package with an update waiting is announced on every run, so
# the promise cannot be quietly forgotten.
upgrade_hold_packages: []

# Upper bound, in seconds, for the package upgrade, which runs as an async job
# so that it survives the connection dropping (see tasks/main.yml). Generous on
# purpose: when it expires the wrapper SIGKILLs the whole process group, and a
# killed dpkg breaks a host far more thoroughly than a slow mirror.
upgrade_async_timeout: 3600

# Seconds between checks on the running upgrade.
upgrade_async_poll: 15

# Reboot the host automatically when the system signals one is required.
upgrade_reboot: true

# Seconds to wait for the host to come back online after a reboot.
upgrade_reboot_timeout: 600
