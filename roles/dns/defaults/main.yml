---
# Encrypted DNS for the host's OWN lookups — apt, ACME, the panel, mesh names.
# NOT the VPN clients' DNS: xray resolves their traffic itself over DoH, and
# nothing here touches that path.

# Upstream resolvers, in preference order. The `#hostname` suffix is not
# decoration: without it the TLS certificate can only be checked against the
# IP, and the point of choosing a resolver is knowing you reached it.
# Two independent operators, each with both of its anycast addresses and both
# families. systemd-resolved tries them in order and stays on the one that
# answers, so this is a preference list, not a load-balancing pool.
#
# Cloudflare first on latency: it has the widest anycast footprint, and every
# lookup here is on the critical path for apt, ACME and reaching the panel.
# Quad9 second for independence — a Swiss foundation, DNSSEC-validating, and
# not the same company as the fallback below.
#
# IPv6 entries are not decoration: these nodes are dual-stack, and an IPv4-only
# list makes DNS fail during an IPv4 incident that the node would otherwise
# survive.
dns_servers:
  - "1.1.1.1#cloudflare-dns.com"
  - "2606:4700:4700::1111#cloudflare-dns.com"
  - "1.0.0.1#cloudflare-dns.com"
  - "9.9.9.9#dns.quad9.net"
  - "2620:fe::fe#dns.quad9.net"
  - "149.112.112.112#dns.quad9.net"

# Used only when every server above is unreachable. Google last on purpose: the
# most reliably reachable resolver on the internet is the right thing to fall
# back to and the wrong thing to prefer.
dns_fallback_servers:
  - "8.8.8.8#dns.google"
  - "2001:4860:4860::8888#dns.google"

# ALTERNATIVES, for a host where the defaults are filtered — set dns_servers in
# host_vars rather than changing the default. All speak DoT and validate
# DNSSEC:
#
#   194.242.2.2#dns.mullvad.net          no logging, single operator, fewer PoPs
#   193.110.81.0#dns0.eu                 European non-profit, ECS off
#   94.140.14.14#dns.adguard-dns.com     filters ads and trackers as well
#
# Filtering resolvers deserve a thought before a node uses one: they answer
# NXDOMAIN for what they block, and a node needs registries, mirrors and ACME
# endpoints to resolve, not opinions about them.

# Strict DNS-over-TLS: no silent downgrade to plaintext. The cost is that an
# unreachable upstream breaks resolution outright rather than degrading — which
# is the correct trade for a resolver chosen on purpose, but it does mean a
# typo in dns_servers takes the node off the network by name.
#
# systemd-resolved speaks DoT and NOT DoH. DoH needs a separate always-running
# daemon; it buys blocking-resistance (port 443 rather than 853) and costs a
# process that takes DNS with it when it dies. Worth it only where 853 is
# actually filtered — set per host, do not standardise on it fleet-wide.
dns_over_tls: true

# Strict DNSSEC validation. A domain with broken DNSSEC then fails to resolve
# instead of resolving unvalidated. Set "allow-downgrade" to prefer
# availability over authenticity.
dns_dnssec: true

# `~.` makes these servers authoritative for every domain that no other scope
# claims. NetBird's own scope keeps the mesh domain, so mesh names are
# unaffected — verified by this role before it reports success.
dns_search_domain: "~."

# --- Making systemd-resolved the resolver at all ---------------------------
# On Debian 12+ systemd-resolved is a separate package, absent from a minimal
# install. Every hand-built node here got it manually; the node built entirely
# by the pipeline had no resolver, so NetBird took /etc/resolv.conf for itself
# and forwarded in plaintext to whatever the provider image configured.
#
# A node rebuilt through the pipeline therefore loses encrypted DNS silently.
# The role installs the package and points resolv.conf at the resolved stub,
# then restarts NetBird so it re-registers the mesh domain against the new
# resolver instead of owning the file.
#
# Set false to configure resolved without taking resolv.conf from whoever holds
# it — useful only if something else on the host must keep owning it.
dns_manage_resolv_conf: true
dns_stub_resolv_conf: /run/systemd/resolve/stub-resolv.conf

# Docker gives a container its own copy of /etc/resolv.conf when the container
# is CREATED and never revisits it. Replacing the host's file therefore leaves
# every already-running container pointing at the resolver that was there
# before — which, once NetBird re-registers with resolved, stops answering.
#
# Nothing fails during the play; the role verifies the host and the host is
# fine. The containers just stop resolving, and the first thing that needs DNS
# is ACME renewal, up to 60 days later. So the role STOPS when it finds running
# containers rather than reporting success over a delayed outage — but only when
# the handover is actually pending. If /etc/resolv.conf is already the stub the
# role takes nothing away and the check is skipped, which is what keeps a re-run
# of provision-node.yml working on a node the pipeline already built.
#
# Set true when you have arranged to restart the stack after the play — a
# restart gives each container a fresh copy pointing at the stub, which is the
# correct end state. Issue #153 tracks removing the need for this.
dns_allow_running_containers: false

# --- The half that makes the rest take effect ------------------------------
# systemd-resolved resolves per SCOPE, and an interface's own servers beat the
# global ones. Provider images ship `dns-nameservers` in the interface config;
# ifupdown hands those to resolvectl (/sbin/resolvconf is a symlink to it), so
# the interface acquires its own resolvers and every query goes there. The
# global configuration above then applies to nothing at all, while
# `resolvectl status` still shows it and looks correct.
#
# Set false only on a host whose interface DNS must stay.
dns_strip_interface_nameservers: true
dns_interfaces_file: /etc/network/interfaces

# --- Verification ----------------------------------------------------------
# Resolved after applying, to prove the resolver works rather than that the
# config file was written. Any name the fleet genuinely depends on will do.
dns_verify_name: deb.debian.org
