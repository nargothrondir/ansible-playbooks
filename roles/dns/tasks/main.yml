---
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >
      Unsupported OS: {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}.
      Only Debian/Ubuntu are supported.
  tags:
    - install

# --- containers already running --------------------------------------------
# Docker writes every container its own /etc/resolv.conf when the container is
# CREATED, copying whatever the host had at that moment, and never revisits it.
# Taking the host file over therefore leaves each running container pointing at
# the resolver that was there before — on the lab node that was NetBird's mesh
# address, which stops answering the moment NetBird re-registers with resolved.
#
# Nothing fails while the play runs. The role's own verification passes, because
# it checks the HOST. The containers simply stop resolving, and the first thing
# to need DNS is ACME renewal — up to 60 days later, with the cause 60 days
# behind it. Measured on the lab node: the ACME hook resolved fine at 02:29 and
# returned "Temporary failure in name resolution" at 04:40, across this role.
#
# Restarting a container fixes it properly (it gets a fresh copy pointing at the
# stub), but restarting the stack is the operator's call, not the role's — one
# of these containers is carrying user traffic.
#
# Checked FIRST, before anything is touched: failing after the handover would
# leave the host between two resolvers.
#
# A plain `docker restart` is the entire fix, on both network types — measured,
# because the documented behaviour suggested otherwise. A host-network container
# gets the file copied verbatim and reaches the stub through the shared netns; a
# container on a user-defined bridge never sees the host's servers at all, it
# gets Docker's embedded resolver, which forwards from the host's netns. Neither
# falls back to Docker's plaintext defaults — that only happens on the default
# `bridge` network, which nothing here uses. Issue #153 carries the numbers.
- name: List containers that would be left with a stale resolver
  ansible.builtin.command: "docker ps --format '{% raw %}{{.Names}}{% endraw %}'"
  register: dns_running_containers
  changed_when: false
  failed_when: false
  when: dns_manage_resolv_conf | bool
  tags:
    - config

- name: Refuse to strand containers that are already running
  ansible.builtin.assert:
    that:
      - dns_running_containers.stdout | default('') | length == 0
    fail_msg: >-
      These containers are running and hold the resolver configuration Docker
      copied for them when they were created:
      {{ dns_running_containers.stdout_lines | default([]) | join(', ') }}.
      This role replaces /etc/resolv.conf, which leaves them pointing at a
      resolver that stops answering — silently, until something needs DNS.
      Restart them once this play finishes and they pick up the new one. Re-run
      with -e dns_allow_running_containers=true once that is arranged. See
      issue #153.
    success_msg: "No running containers to strand"
  when:
    - dns_manage_resolv_conf | bool
    - not (dns_allow_running_containers | bool)
  tags:
    - config

# On Debian 12+ systemd-resolved is a SEPARATE PACKAGE and a minimal install
# does not have it. Every production node here got it by hand; the node built
# entirely by the pipeline had no resolver at all, and NetBird — finding none —
# took /etc/resolv.conf for itself and forwarded to whatever the provider image
# had configured, in plaintext.
#
# So a node rebuilt through the pipeline silently loses encrypted DNS. It does
# not fail, it just stops having it. Installing the package is therefore part
# of the role, not a precondition for it.
- name: Install systemd-resolved
  ansible.builtin.apt:
    name: systemd-resolved
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: dns_resolved_installed
  tags:
    - install

- name: Ensure the drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - config

# BEFORE the resolver is made authoritative below. Pointing resolv.conf at a
# resolver that has no upstreams yet would break every lookup on the host for
# as long as it took the next task to run.
- name: Deploy the encrypted-DNS drop-in
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf.d/50-encrypted-dns.conf
    owner: root
    group: root
    mode: "0644"
  notify: "restart systemd-resolved"
  tags:
    - config

- name: Ensure systemd-resolved is enabled and running
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: started
    enabled: true
    daemon_reload: true
  register: dns_resolved_started
  tags:
    - service

- name: Apply the pending resolved restart before it becomes authoritative
  ansible.builtin.meta: flush_handlers

# What actually makes systemd-resolved the system resolver. On a host that had
# no resolver, NetBird owns this file as a PLAIN FILE listing its own address;
# replacing it hands resolution to resolved, whose stub forwards to the
# upstreams configured above.
#
# Backed up first, and only touched when it is not already the stub symlink —
# on the hand-built nodes it is, and this is a no-op there.
- name: Check what /etc/resolv.conf currently is
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: dns_resolv_conf
  tags:
    - config

- name: Back up the resolver configuration being replaced
  ansible.builtin.copy:
    src: /etc/resolv.conf
    dest: /etc/resolv.conf.before-dns-role
    remote_src: true
    owner: root
    group: root
    mode: "0644"
    force: false
  when:
    - dns_manage_resolv_conf | bool
    - dns_resolv_conf.stat.lnk_source | default('') != dns_stub_resolv_conf
  tags:
    - config

- name: Point /etc/resolv.conf at the resolved stub
  ansible.builtin.file:
    src: "{{ dns_stub_resolv_conf }}"
    dest: /etc/resolv.conf
    state: link
    force: true
  when:
    - dns_manage_resolv_conf | bool
    - dns_resolv_conf.stat.lnk_source | default('') != dns_stub_resolv_conf
  tags:
    - config

# Needed by the guard on the next task. Collected HERE rather than at the top,
# so it reflects the state after systemd-resolved was installed and started.
- name: Collect service facts
  ansible.builtin.service_facts:
  tags:
    - service

# NetBird decides how to publish the mesh domain when it STARTS: with resolved
# present it registers as a link scope, without it it rewrites resolv.conf.
# A node that just gained a resolver is still running the second arrangement,
# and the file it was holding has just been replaced — so mesh names resolve
# nowhere until it re-detects.
#
# Only when something above actually changed. Restarting NetBird on every run
# would flap the mesh for nothing, and the mesh is how the panel reaches this
# node.
- name: Re-register NetBird against the new resolver
  ansible.builtin.systemd_service:
    name: netbird
    state: restarted
  when:
    - dns_manage_resolv_conf | bool
    - dns_resolved_installed is changed or dns_resolved_started is changed
      or (dns_resolv_conf.stat.lnk_source | default('') != dns_stub_resolv_conf)
    - "'netbird.service' in (ansible_facts.services | default({}))"
  tags:
    - service

# --- interface-supplied nameservers ----------------------------------------
# The other half, and the one that bites on the hand-built nodes: an
# interface's own servers beat the global ones, so `dns-nameservers` in the
# interfaces file quietly wins and the upstreams above apply to nothing.
#
# The existence check has to be a stat on the TARGET. Jinja's `is exists` tests
# the controller's filesystem, and the controller here is a Semaphore container
# that has no /etc/network/interfaces — so the guard was always false and the
# nameservers were never stripped, on any host, while the play reported ok.
- name: Check whether the interfaces file exists on the target
  ansible.builtin.stat:
    path: "{{ dns_interfaces_file }}"
  register: dns_interfaces_stat
  when: dns_strip_interface_nameservers | bool
  tags:
    - config

- name: Remove interface-supplied nameservers from the interfaces file
  ansible.builtin.lineinfile:
    path: "{{ dns_interfaces_file }}"
    regexp: '^\s*dns-nameservers\s'
    state: absent
    backup: true
  when:
    - dns_strip_interface_nameservers | bool
    - dns_interfaces_stat.stat.exists | default(false)
  tags:
    - config

# The edit above only changes what the NEXT ifup would publish; the interface
# is up and resolved still holds its servers. `resolvectl revert` clears a
# link's settings WITHOUT touching the interface — bouncing the interface would
# drop the SSH session running this play.
#
# Default-route interface only. Reverting the NetBird link would take the mesh
# domain with it.
- name: Read the link's current DNS settings
  ansible.builtin.command: "resolvectl dns {{ ansible_facts['default_ipv4']['interface'] }}"
  register: dns_link_current
  changed_when: false
  failed_when: false
  when: dns_strip_interface_nameservers | bool
  tags:
    - config

- name: Clear the link's DNS settings so the global ones apply
  ansible.builtin.command: "resolvectl revert {{ ansible_facts['default_ipv4']['interface'] }}"
  when:
    - dns_strip_interface_nameservers | bool
    - dns_link_current.stdout | default('') is search(':\s*\S')
  changed_when: dns_link_current.stdout | default('') is search(':\s*\S')
  tags:
    - config

# --- verification ----------------------------------------------------------
# Behaviour, not configuration. "The file was written" is what this repository
# keeps mistaking for "it works".
- name: Read the resolver state
  ansible.builtin.command: resolvectl status
  register: dns_status
  changed_when: false
  retries: 3
  delay: 2
  until: dns_status.rc == 0
  tags:
    - config

- name: Assert encrypted DNS is actually in force
  ansible.builtin.assert:
    that:
      - dns_status.stdout is search('\+DNSOverTLS')
    fail_msg: >-
      resolvectl does not report +DNSOverTLS after applying the drop-in. The
      file was written but is not in effect — check for a second drop-in
      overriding it, or a DNSOverTLS setting left in
      /etc/systemd/resolved.conf itself.
    success_msg: "Encrypted DNS is in force"
  when: dns_over_tls | bool
  tags:
    - config

- name: Resolve a name through the configured resolver
  ansible.builtin.command: "resolvectl query --cache=no {{ dns_verify_name }}"
  register: dns_verify
  changed_when: false
  retries: 5
  delay: 3
  until: dns_verify.rc == 0
  tags:
    - config

# The mesh is the path the panel uses to reach this node. If the handover left
# NetBird unregistered, the node keeps serving traffic while becoming
# unmanageable — and that is visible only later, from the panel side.
#
# Guarded on NetBird actually being installed, not just on the domain being
# configured. `netbird_dns_domain` comes from group_vars and is therefore set on
# a host that has never joined the mesh — including a node mid-provision, where
# this role now runs BEFORE the netbird role. Without this guard the check
# retried five times and failed the whole provisioning run over a mesh that did
# not exist yet.
- name: Resolve this host's own mesh name
  ansible.builtin.command: "resolvectl query --cache=no {{ inventory_hostname }}.{{ netbird_dns_domain }}"
  register: dns_verify_mesh
  changed_when: false
  retries: 5
  delay: 3
  until: dns_verify_mesh.rc == 0
  when:
    - netbird_dns_domain | default('') | length > 0
    - "'netbird.service' in (ansible_facts.services | default({}))"
  tags:
    - config

# Read AFTER the queries above: the global scope reports no "Current DNS
# Server" until something has actually resolved through it.
- name: Re-read the resolver state now that queries have gone through
  ansible.builtin.command: resolvectl status
  register: dns_status_after
  changed_when: false
  tags:
    - config

- name: Read the default link's DNS settings after the change
  ansible.builtin.command: "resolvectl dns {{ ansible_facts['default_ipv4']['interface'] }}"
  register: dns_link_after
  changed_when: false
  failed_when: false
  tags:
    - config

# This used to key off `-- link:` in the query output, reading it as the scope
# that answered. It is not: that annotation names the interface the RETURNED
# ADDRESS is reachable over. Verified on the lab node, where the default link
# has "Current Scopes: LLMNR/IPv4 LLMNR/IPv6" and no DNS servers at all, yet
# every answer still carried its name — so the old line reported a correctly
# configured host as broken.
#
# What settles it instead: which upstream the global scope is talking to, and
# whether the default link kept servers of its own.
- name: Report which resolver is actually in use
  ansible.builtin.debug:
    msg: >-
      {{ dns_verify_name }} resolved.
      Global scope —
      {{ dns_status_after.stdout | regex_search('Current DNS Server: \S+')
         | default('no upstream selected yet', true) }}.
      Default link ({{ ansible_facts['default_ipv4']['interface'] }})
      {{ 'STILL has servers of its own, which beat the global ones: '
         ~ (dns_link_after.stdout | default('') | trim)
         if dns_link_after.stdout | default('') is search(':\s*\S')
         else 'has none of its own, so the global servers apply' }}.
  tags:
    - debug

# Only reached with the guard waived, so the operator has already accepted this
# — but the list is worth having at the end of the run rather than at the start,
# where it has scrolled past.
- name: Remind that the running containers still hold the old resolver
  ansible.builtin.debug:
    msg: >-
      Restart these containers so they pick up the new resolver:
      {{ dns_running_containers.stdout_lines | join(', ') }}. Until then they
      resolve through the address they were created with, which no longer
      answers.
  when:
    - dns_manage_resolv_conf | bool
    - dns_allow_running_containers | bool
    - dns_running_containers.stdout | default('') | length > 0
  tags:
    - debug
