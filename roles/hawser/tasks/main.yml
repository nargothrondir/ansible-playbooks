---
# The URL's host is checked for shape, not just presence. The inventory builds
# it from a domain variable, and if that variable is defined but empty the
# result is "wss://dockhand./api/hawser/connect" — syntactically valid,
# non-empty, and pointing nowhere. A length check waves it through.
- name: Assert Hawser connection settings are provided
  ansible.builtin.assert:
    that:
      - hawser_dockhand_url | length > 0
      - hawser_dockhand_url | urlsplit('hostname') | default('', true) | lower is match('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')
      - hawser_token | length > 0
    fail_msg: >
      hawser requires hawser_dockhand_url (group_vars/all) with a usable host
      and a per-host hawser_token (host_vars/<host>/vault.yml). A host ending
      in a bare dot means the domain variable the URL is built from resolved to
      an empty string.
  tags:
    - config

- name: Ensure Hawser directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ hawser_dir }}"
    - "{{ hawser_stacks_dir }}"
  loop_control:
    label: "{{ item }}"
  tags:
    - config

# Fetched on the CONTROLLER, never on the node. raw.githubusercontent.com is
# intermittently blocked where part of the fleet lives, and provisioning must not
# depend on a node's ability to reach GitHub. Semaphore already cannot start a
# run without GitHub, so this adds no new failure domain — it just keeps the one
# we have on the side that already has it.
#
# changed_when: false because this writes to controller scratch and changes no
# managed host. The copy below is the honest change detector.
#
# No checksum: the ref is a git commit hash, which IS the content address. A
# second checksum would restate the same guarantee and then rot separately.
- name: Fetch the pinned Hawser compose from docker-stacks
  ansible.builtin.get_url:
    url: "{{ hawser_compose_url }}"
    dest: "{{ hawser_compose_cache }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  tags:
    - config

- name: Deploy Hawser compose file
  ansible.builtin.copy:
    src: "{{ hawser_compose_cache }}"
    dest: "{{ hawser_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  tags:
    - config

# The compose file carries no credential any more — TOKEN lives here, and only
# here. 0600 keeps it off the host, no_log keeps it out of the run: --diff prints
# a changed template's full content and -vvv prints module arguments. §7, and the
# same pairing as roles/semaphore, roles/crowdsec and roles/beszel_agent.
#
# Compose reads .env from the project directory automatically, so nothing has to
# point at it — which is also why it must sit beside the compose file and not in
# a tidier location.
- name: Deploy the Hawser environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ hawser_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags:
    - config

- name: Start Hawser
  community.docker.docker_compose_v2:
    project_src: "{{ hawser_dir }}"
    state: present
  tags:
    - service
