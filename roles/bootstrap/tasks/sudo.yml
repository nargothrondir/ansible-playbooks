---
- name: Refresh APT metadata before installing sudo
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when:
    - bootstrap_passwordless_sudo
    - ansible_facts.os_family == 'Debian'
  tags:
    - config

- name: Install sudo before configuring its policy
  ansible.builtin.package:
    name: sudo
    state: present
  when: bootstrap_passwordless_sudo
  tags:
    - config

- name: Ensure the sudoers drop-in directory exists
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: bootstrap_passwordless_sudo
  tags:
    - config

- name: Grant passwordless sudo to automation user
  ansible.builtin.template:
    src: ansible-sudoers.j2
    dest: "{{ _bootstrap_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  when: bootstrap_passwordless_sudo
  tags:
    - config
