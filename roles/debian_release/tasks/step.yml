---
# One release step: _debian_release_step is the major version being moved to,
# and _debian_release_resuming is true when an earlier run already got past the
# update of the current release in this very step (the marker, tasks/main.yml).
# The order below follows Debian's release notes, with the checks that can stop
# a run placed BEFORE anything is changed wherever the information allows.

# Release notes: "This procedure assumes your system has been updated to the
# latest point release". Under async because on a live node this alone can be a
# long transaction, and because sshd may restart inside it.
#
# Skipped when resuming, and that is a safety property rather than a shortcut:
# by then the sources name the new release, and this task is a dist-upgrade. Run
# against those sources it would perform the full upgrade before the removal
# check below had seen it.
- name: Bring the current release fully up to date before moving to Debian {{ _debian_release_step }}
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  environment:
    NEEDRESTART_MODE: l
  async: "{{ debian_release_async_timeout }}"
  poll: "{{ debian_release_async_poll }}"
  when: not (_debian_release_resuming | bool)
  tags:
    - install

# Preconditions the release notes name for THIS step (vars/main.yml). Checked
# after the update above, which is what normally satisfies them.
- name: Read the installed version of each package this step has a precondition on
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${Version}
      - "{{ item.key }}"
  loop: "{{ _debian_release_known[_debian_release_step].min_versions | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _debian_release_installed
  changed_when: false
  # 1 means not installed, which the precondition does not apply to.
  failed_when: _debian_release_installed.rc not in [0, 1]
  check_mode: false
  tags:
    - install

- name: Compare each against the minimum this step requires
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ item.stdout }}"
      - ge
      - "{{ item.item.value }}"
  loop: "{{ _debian_release_installed.results | default([]) | selectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.key }} {{ item.stdout }}"
  register: _debian_release_compared
  changed_when: false
  failed_when: _debian_release_compared.rc not in [0, 1]
  check_mode: false
  tags:
    - install

- name: Assert every precondition of this step holds
  ansible.builtin.assert:
    that:
      - _debian_release_compared.results | default([]) | selectattr('rc', 'ne', 0) | list | length == 0
    fail_msg: >-
      Debian {{ _debian_release_step }} needs
      {% for r in _debian_release_compared.results | default([]) | selectattr('rc', 'ne', 0) %}{{ r.item.item.key }} >= {{ r.item.item.value }} (installed {{ r.item.stdout }}){{ ', ' if not loop.last }}{% endfor %}
      before the step starts. The update of the current release should have
      provided it; if it did not, the host's sources are not reaching that
      release's -updates or -security suite. Nothing has been moved yet.
  tags:
    - install

# From the next task on, the host starts becoming the new release, and
# /etc/debian_version is not a reliable witness of how far it got: the minimal
# stage already upgrades base-files, which owns it and /etc/os-release, the
# files Ansible reads the release from (measured on ru-1: base-files
# 13.8+deb13u7 installed while the full upgrade had not run). A run stopped
# after that would find the host reporting the new release and skip the rest of
# the step. This marker is what says otherwise; it is removed only after the
# final check at the end.
#
# Written here and not at the very top, so that its presence also means the
# update of the current release above has finished -- which is exactly what the
# resume logic needs to know to skip it.
- name: Ensure the state directory exists
  ansible.builtin.file:
    path: "{{ debian_release_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - install

- name: Mark as started the move to Debian {{ _debian_release_step }}
  ansible.builtin.copy:
    content: "{{ _debian_release_step }}\n"
    dest: "{{ debian_release_state_dir }}/in-progress"
    owner: root
    group: root
    mode: "0644"
  tags:
    - install

# BEFORE the sources change. Pinned first, an interrupted run is safe to reboot
# at any point from here on.
#
# Physical interfaces only: the facts give `module` only to an interface with a
# device/driver/module link in sysfs, which veth, bridges, WireGuard and
# loopback do not have. Pinned by MAC, and named 10- so it is the first .link
# that matches -- systemd applies exactly one, and Name= in a file with no
# NamePolicy= takes effect.
- name: Pin every physical interface to its current name
  ansible.builtin.template:
    src: pin-interface.link.j2
    dest: "{{ debian_release_link_dir }}/10-debian-release-{{ item.device }}.link"
    owner: root
    group: root
    mode: "0644"
  loop: >-
    {{ ansible_facts['interfaces']
       | map('replace', '-', '_')
       | select('in', ansible_facts)
       | map('extract', ansible_facts)
       | selectattr('module', 'defined')
       | selectattr('macaddress', 'defined')
       | list }}
  loop_control:
    label: "{{ item.device }} {{ item.macaddress }}"
  register: _debian_release_pins
  when: debian_release_pin_interface_names | bool
  tags:
    - config

# Unconditional on purpose: a stat costs nothing, and gating it on the pins as
# well would be a second task running "when changed" for no benefit.
- name: Check whether this host builds an initramfs
  ansible.builtin.stat:
    path: /usr/sbin/update-initramfs
  register: _debian_release_initramfs_tool
  tags:
    - config

# Debian's udev initramfs hook copies every *.link from /etc/systemd/network
# into the image, so names are decided in early boot too. The new release's
# kernel gets a fresh image during the upgrade, after the pins exist; this makes
# the images of the kernels already installed agree with them as well.
# Inline rather than a handler: handlers run at the end of the play, and the
# reboot this must precede is a few tasks below.
- name: Rebuild the initramfs so early boot names interfaces the same way # noqa: no-handler — must happen before the reboot at the end of this step, and handlers only run at the end of the play
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true # spec-ok: update-initramfs rewrites every image each time it runs, and it only runs when a pin file changed
  when:
    - _debian_release_pins is changed
    - _debian_release_initramfs_tool.stat.exists
  tags:
    - config

- name: Point the Debian sources at the next release, {{ _debian_release_known[_debian_release_step].codename }}
  ansible.builtin.include_role:
    name: apt_sources
    apply:
      tags:
        - config
  vars:
    apt_sources_suite: "{{ _debian_release_known[_debian_release_step].codename }}"
  tags:
    - config

- name: Refresh the package lists from the sources for Debian {{ _debian_release_step }}
  ansible.builtin.apt:
    update_cache: true
  tags:
    - install

# The release notes' first stage: upgrade what can move without installing
# anything new or removing anything, so the full upgrade that follows has fewer
# conflicts to resolve. apt-get's `upgrade` does exactly that by default; the
# apt module cannot express it -- every one of its upgrade modes passes
# --with-new-pkgs or runs dist-upgrade -- hence the command, with the same
# non-interactive environment and dpkg options the module would use.
- name: Upgrade what can move to the next release without new packages or removals # noqa: command-instead-of-module — the apt module's upgrade modes all add --with-new-pkgs or run dist-upgrade, so the minimal stage the release notes prescribe cannot be expressed with it
  ansible.builtin.command:
    argv:
      - apt-get
      - upgrade
      - --assume-yes
      - -o
      - "Dpkg::Options::=--force-confdef"
      - -o
      - "Dpkg::Options::=--force-confold"
  environment:
    DEBIAN_FRONTEND: noninteractive
    DEBIAN_PRIORITY: critical
    NEEDRESTART_MODE: l
    LANG: C
    LC_ALL: C
  async: "{{ debian_release_async_timeout }}"
  poll: "{{ debian_release_async_poll }}"
  register: _debian_release_minimal
  changed_when: >-
    _debian_release_minimal.stdout is not
    search('^0 upgraded, 0 newly installed, 0 to remove', multiline=True)
  tags:
    - install

# The minimal stage reduces removals; this refuses the rest. `apt-get -y` aborts
# on its own only for ESSENTIAL packages -- anything else it removes silently --
# so the plan is read first. The simulation and the upgrade below both run
# dist-upgrade, so they are the same resolver on the same state.
- name: Simulate the full upgrade to the next release # noqa: command-instead-of-module — the apt module cannot report which packages a dist-upgrade would remove without performing it
  ansible.builtin.command:
    argv:
      - apt-get
      - --simulate
      - dist-upgrade
  environment:
    LANG: C
    LC_ALL: C
  register: _debian_release_simulated
  changed_when: false
  check_mode: false
  tags:
    - install

# A removal is also how apt performs a rename. Debian 13 renamed libraries for
# the 64-bit time_t transition: libssl3t64 declares Replaces: libssl3,
# Breaks: libssl3 (<< ...) and Provides: libssl3, so installing it removes the
# old name. On ru-1 all 24 removals between bookworm and trixie were renames.
#
# Matched against what the release PUBLISHES rather than what the simulation
# installs, because a successor is not always pulled in: libdw1 was removed with
# no libdw1t64 installed (elfutils 0.192-4 declares Replaces/Breaks libdw1),
# since nothing on the node depended on it. Had anything, apt would have
# installed the successor -- and a dependent it chose to remove instead would be
# a removal of its own, not a rename, and would stop the run here.
- name: List the packages the new release publishes under its rename marker
  ansible.builtin.command:
    argv:
      - apt-cache
      - search
      - --names-only
      - "{{ _debian_release_known[_debian_release_step].rename_marker }}"
  environment:
    LANG: C
    LC_ALL: C
  register: _debian_release_renamed
  changed_when: false
  check_mode: false
  when: _debian_release_known[_debian_release_step].rename_marker | default('') | length > 0
  tags:
    - install

# The package name is the second word of a `Remv <package> [<version>]` line,
# and the first word of an `apt-cache search` line. Taken with split rather than
# regex_replace: Jinja decodes escape sequences in string literals, so a '\1'
# backreference arrives as the character U+0001.
- name: Separate the removals that are renames from the rest
  ansible.builtin.set_fact:
    _debian_release_removals: >-
      {{ _debian_release_simulated.stdout_lines | select('match', '^Remv ')
         | map('split') | map(attribute='1') | list }}
    _debian_release_renamed_from: >-
      {{ _debian_release_renamed.stdout_lines | default([])
         | map('split') | map(attribute='0')
         | map('replace', _debian_release_known[_debian_release_step].rename_marker | default(''), '')
         | list }}
  tags:
    - install

- name: Assert the full upgrade removes nothing but renamed packages
  ansible.builtin.assert:
    that:
      - _debian_release_removals | reject('in', _debian_release_renamed_from) | list | length == 0
    success_msg: >-
      {{ _debian_release_removals | length }} removal(s), each a package Debian
      {{ _debian_release_step }} publishes under a new name.
    fail_msg: >-
      The full upgrade to Debian {{ _debian_release_step }} would remove
      {{ _debian_release_removals | reject('in', _debian_release_renamed_from) | join(', ') }},
      which the release does not publish under a new name
      ({{ _debian_release_removals | select('in', _debian_release_renamed_from) | list | length }}
      other removal(s) are renames and would have been allowed). apt removes
      non-essential packages without asking, so the run stops here. The host is
      on the new release's sources with the minimal stage applied, and the step
      is marked unfinished: decide on the host whether those removals are
      acceptable, then run again and it resumes.
  tags:
    - install

- name: Complete the upgrade to Debian {{ _debian_release_step }}
  ansible.builtin.apt:
    upgrade: dist
  environment:
    NEEDRESTART_MODE: l
  async: "{{ debian_release_async_timeout }}"
  poll: "{{ debian_release_async_poll }}"
  tags:
    - install

# Release notes: "You will have to do a kernel upgrade when upgrading ..., so a
# reboot will be necessary."
- name: Reboot into Debian {{ _debian_release_step }}
  ansible.builtin.reboot:
    reboot_timeout: "{{ debian_release_reboot_timeout }}"
  tags:
    - service

# Every fact read so far describes the release the host just left, including
# distribution_release, from which later roles derive their repository suites.
- name: Re-read the host facts after the reboot
  ansible.builtin.setup:
  tags:
    - service

- name: Assert the host is now on Debian {{ _debian_release_step }}
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution_major_version'] == _debian_release_step
    fail_msg: >-
      After upgrading and rebooting, the host reports Debian
      {{ ansible_facts['distribution_major_version'] }}
      ({{ ansible_facts['distribution_release'] }}), not {{ _debian_release_step }}.
      The upgrade transactions reported success, so check /etc/debian_version
      and apt's history in /var/log/apt/history.log on the host. The step stays
      marked unfinished, so the next run repeats it.
  when: not ansible_check_mode
  tags:
    - service

- name: Clear the in-progress marker of the finished move to Debian {{ _debian_release_step }}
  ansible.builtin.file:
    path: "{{ debian_release_state_dir }}/in-progress"
    state: absent
  when: not ansible_check_mode
  tags:
    - service
