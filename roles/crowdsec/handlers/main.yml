---
- name: Reload the CrowdSec agent
  listen: "reload crowdsec"
  ansible.builtin.systemd_service:
    name: crowdsec
    state: reloaded

- name: Restart the CrowdSec firewall bouncer
  listen: "restart crowdsec bouncer"
  ansible.builtin.systemd_service:
    name: crowdsec-firewall-bouncer
    state: restarted
