---
# Self-sufficiency for standalone/DR runs: deb822_repository needs these on the
# target. The common role pre-satisfies this in the pipeline (no-op here).
- name: Install prerequisites for the CrowdSec repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install

- name: Ensure the APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    - install

# Managed by an explicit task (not deb822's signed_by URL download) so a missing
# keyring is recreated on the next run instead of breaking apt.
- name: Download the CrowdSec APT signing key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /etc/apt/keyrings/crowdsec.asc
    mode: "0644"
  register: _crowdsec_key_download
  until: _crowdsec_key_download is succeeded
  retries: 3
  delay: 5
  tags:
    - install

# CrowdSec's packagecloud repo is distribution-agnostic: use the "/any/ any"
# path, NOT "/debian/<codename>". The per-codename path has no Release file for
# Debian 13/trixie (crowdsec issue #3834/#3909); the official install.crowdsec.net
# script uses "/any/ any main" for every Debian/Ubuntu release.
- name: Add the CrowdSec APT repository (deb822)
  ansible.builtin.deb822_repository:
    name: crowdsec
    types: deb
    uris: https://packagecloud.io/crowdsec/crowdsec/any
    suites: any
    components: main
    architectures: "{{ crowdsec_apt_arch | default('amd64') }}"
    signed_by: /etc/apt/keyrings/crowdsec.asc
    state: present
  tags:
    - install

- name: Install CrowdSec and the nftables firewall bouncer
  ansible.builtin.apt:
    name:
      - crowdsec
      - crowdsec-firewall-bouncer-nftables
    state: present
    update_cache: true
  tags:
    - install

# The agent starts ALONE and FIRST. Registering a bouncer talks to the local
# LAPI, which is the agent — so nothing below can work until it is up.
- name: Ensure the CrowdSec agent is enabled and running
  ansible.builtin.systemd_service:
    name: crowdsec
    state: started
    enabled: true
  tags:
    - service

# The bouncer is NOT started here. It cannot run before it is registered with
# the LAPI, and the registration lives in config.yml — so starting it at this
# point is what produced "API error: access forbidden" on the first fresh
# install: the service start failed and aborted the play before the task that
# would have fixed it ever ran.
#
# The agent above starts here because the registration talks to it.
