---
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >
      Unsupported OS: {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}.
      Only Debian/Ubuntu are supported.
  tags:
    - config

- name: Deploy the sshd mesh-port drop-in
  ansible.builtin.template:
    src: mesh-port.conf.j2
    dest: /etc/ssh/sshd_config.d/10-ansible-mesh-port.conf
    owner: root
    group: root
    mode: "0644"
  notify: "reload sshd"
  tags:
    - config
    - ssh

# The key is written BEFORE the drop-in that names it, and the order is not
# cosmetic: TrustedUserCAKeys pointing at a file that is not there makes sshd
# log an error on every authentication attempt. Both tasks skip together when
# no key was supplied, so a host is never left holding one half.
- name: Install the fleet CA public key
  ansible.builtin.copy:
    content: "{{ ssh_hardening_ca_public_key | trim }}\n"
    dest: "{{ ssh_hardening_ca_path }}"
    owner: root
    group: root
    mode: "0644"
  when: ssh_hardening_ca_public_key | length > 0
  notify: "reload sshd"
  tags:
    - config
    - ssh

- name: Trust user certificates signed by the fleet CA
  ansible.builtin.template:
    src: ca.conf.j2
    dest: /etc/ssh/sshd_config.d/20-ansible-ca.conf
    owner: root
    group: root
    mode: "0644"
  when: ssh_hardening_ca_public_key | length > 0
  notify: "reload sshd"
  tags:
    - config
    - ssh

# The guard that matters, and the reason this is not just another drop-in.
# PermitRootLogin prohibit-password on a host where root has no key does not
# harden anything — it removes the break-glass and leaves nothing in its place.
# So look before writing, rather than trusting that the provider injected a key.
#
# Key authentication for the automation user needs no such check: this role is
# running over SSH with a key right now, which is the proof.
- name: Look at what root can currently log in with
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: _ssh_hardening_root_keys
  failed_when: false
  when:
    - ssh_hardening_disable_password_auth | bool
    - ssh_hardening_permit_root_login == 'prohibit-password'
  tags:
    - config
    - ssh

- name: Assert root keeps a way in that is not a password
  ansible.builtin.assert:
    that:
      - _ssh_hardening_root_keys.content is defined
      - (_ssh_hardening_root_keys.content | b64decode | trim) | length > 0
    fail_msg: >-
      /root/.ssh/authorized_keys is missing or empty, so setting
      PermitRootLogin prohibit-password would leave root unreachable — this
      host's only root access today is the password about to be switched off.
      Install the admin key for root first (ssh-copy-id, or re-run
      provision-node.yml with the root password field), or choose
      ssh_hardening_permit_root_login=no deliberately, knowing that console
      access at the provider becomes the only way back in.
  when:
    - ssh_hardening_disable_password_auth | bool
    - ssh_hardening_permit_root_login == 'prohibit-password'
  tags:
    - config
    - ssh

# Caught here rather than by a puzzling comparison further down. The likeliest
# way to get this wrong is YAML: an unquoted `no` becomes the boolean False and
# stops matching anything at all.
- name: Assert PermitRootLogin is a value sshd understands
  ansible.builtin.assert:
    that:
      - ssh_hardening_permit_root_login in _ssh_hardening_root_login_rendered
    fail_msg: >-
      ssh_hardening_permit_root_login is
      '{{ ssh_hardening_permit_root_login }}', which is not one of
      {{ _ssh_hardening_root_login_rendered.keys() | list | join(', ') }}.
      If you meant no or yes, quote it — YAML reads them as booleans.
  when: ssh_hardening_disable_password_auth | bool
  tags:
    - config
    - ssh

- name: Retire password authentication
  ansible.builtin.template:
    src: auth.conf.j2
    dest: /etc/ssh/sshd_config.d/30-ansible-auth.conf
    owner: root
    group: root
    mode: "0644"
  when: ssh_hardening_disable_password_auth | bool
  notify: "reload sshd"
  tags:
    - config
    - ssh

# Measured ON THE NODE, in the node's own clock and with the node's own
# ssh-keygen. Parsing the timestamp on the controller would compare a local time
# printed there against a local time read here, and the two are not the same
# fleet-wide — a difference that would surface as a certificate renewed early or
# not at all, months from now.
#
# Empty output means no certificate, an unreadable one, or a format this cannot
# read. All three are answered the same way: sign one. The safe direction.
- name: Measure what the current host certificate has left
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      end=$(ssh-keygen -L -f {{ ssh_hardening_host_cert_path | quote }} 2>/dev/null \
            | sed -n 's/.*Valid: from .* to \(.*\)$/\1/p')
      [ -n "$end" ] || exit 0
      echo $(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
    executable: /bin/bash
  register: _ssh_hardening_host_cert_left
  changed_when: false
  failed_when: false
  check_mode: false
  when: ssh_hardening_host_cert | bool
  tags:
    - config
    - ssh

- name: Read what the current host certificate claims
  ansible.builtin.command: "ssh-keygen -L -f {{ ssh_hardening_host_cert_path }}"
  register: _ssh_hardening_host_cert_text
  changed_when: false
  failed_when: false
  check_mode: false
  when: ssh_hardening_host_cert | bool
  tags:
    - config
    - ssh

# TWO conditions, not one, and the second is the one that would have been
# missed. A certificate keeps working after the fleet moves to a different
# domain — still signed, still unexpired — while its principals name something
# nobody types any more. Expiry alone would never notice.
#
# Missing principals only. An EXTRA one is left alone deliberately: during a
# domain move the old name must keep working until every client has been
# re-pointed, and re-signing it away is what would break that overlap.
- name: Decide whether the host certificate must be issued or renewed
  ansible.builtin.set_fact:
    _ssh_hardening_host_cert_needed: >-
      {{ (_ssh_hardening_host_cert_left.stdout | default('') | trim) == ''
         or ((_ssh_hardening_host_cert_left.stdout | trim | int)
             < (ssh_hardening_host_cert_renew_days | int))
         or ((ssh_hardening_host_principals
              | reject('in', _ssh_hardening_host_cert_text.stdout | default(''))
              | list | length) > 0) }}
  when: ssh_hardening_host_cert | bool
  tags:
    - config
    - ssh

- name: Read this host's public host key
  ansible.builtin.slurp:
    src: "{{ ssh_hardening_host_key }}"
  register: _ssh_hardening_host_pubkey
  when:
    - ssh_hardening_host_cert | bool
    - _ssh_hardening_host_cert_needed | bool
  tags:
    - config
    - ssh

# Delegated because the NODE cannot reach OpenBao — its API is on a Docker
# network the panel owns, not on the mesh. become: false because the delegation
# target is the controller, where this play's privilege escalation has no
# business.
#
# changed_when: false — signing mints a credential and alters nothing in the
# store. The change is the file written below.
- name: Ask the CA to sign this host's key
  ansible.builtin.uri:
    url: >-
      {{ ssh_hardening_openbao_addr }}/v1/{{ ssh_hardening_openbao_ssh_mount }}/sign/{{ ssh_hardening_openbao_host_role }}
    method: POST
    headers:
      X-Vault-Token: "{{ ssh_hardening_openbao_token }}"
    body_format: json
    body:
      cert_type: host
      public_key: "{{ _ssh_hardening_host_pubkey.content | b64decode | trim }}"
      valid_principals: "{{ ssh_hardening_host_principals | join(',') }}"
    status_code: [200]
  register: _ssh_hardening_host_signed
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when:
    - ssh_hardening_host_cert | bool
    - _ssh_hardening_host_cert_needed | bool
  tags:
    - config
    - ssh

- name: Install the host certificate
  ansible.builtin.copy:
    content: "{{ _ssh_hardening_host_signed.json.data.signed_key }}"
    dest: "{{ ssh_hardening_host_cert_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - ssh_hardening_host_cert | bool
    - _ssh_hardening_host_cert_needed | bool
  notify: "reload sshd"
  tags:
    - config
    - ssh

# Written every run, not only when the certificate was refreshed: the drop-in
# and the certificate are two separate pieces of state, and a node that somehow
# has one without the other should be corrected rather than left consistent with
# nothing.
- name: Present the host certificate to clients
  ansible.builtin.template:
    src: hostcert.conf.j2
    dest: /etc/ssh/sshd_config.d/40-ansible-hostcert.conf
    owner: root
    group: root
    mode: "0644"
  when: ssh_hardening_host_cert | bool
  notify: "reload sshd"
  tags:
    - config
    - ssh

# Runs before the reload handler fires (handlers run at play end), so a broken
# merged config fails the play while the old sshd keeps serving connections.
- name: Validate the merged sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  tags:
    - config
    - ssh

# "Green but broken" guard (#52): a drop-in can be silently ignored (no
# Include directive in a provider's sshd_config; Ubuntu's socket activation
# needs more than a reload) while sshd -t still passes. Apply the reload now
# and prove the port actually listens.
- name: Apply the pending sshd reload
  ansible.builtin.meta: flush_handlers
  tags:
    - config
    - ssh

- name: Verify sshd listens on the mesh port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ssh_hardening_mesh_port }}"
    timeout: 10
  tags:
    - config
    - ssh

# The same guard, for the half a listening port cannot prove. `sshd -t` says the
# merged config parses; only `sshd -T` says what it merged. A drop-in that was
# never included passes the first and is absent from the second — which is
# exactly how certificate trust would come out looking installed and doing
# nothing, discovered later by a login that quietly falls back to the key.
- name: Read back the configuration sshd actually merged
  ansible.builtin.command: /usr/sbin/sshd -T
  register: _ssh_hardening_sshd_effective
  changed_when: false
  when: >-
    ssh_hardening_ca_public_key | length > 0
    or ssh_hardening_disable_password_auth | bool
    or ssh_hardening_host_cert | bool
  tags:
    - config
    - ssh

- name: Assert sshd is serving certificate trust
  ansible.builtin.assert:
    that:
      - ('trustedusercakeys ' ~ ssh_hardening_ca_path) in _ssh_hardening_sshd_effective.stdout
    fail_msg: >-
      sshd merged its configuration without TrustedUserCAKeys
      {{ ssh_hardening_ca_path }}, so the drop-in at
      /etc/ssh/sshd_config.d/20-ansible-ca.conf is being ignored — check that
      /etc/ssh/sshd_config still carries its Include line. Nothing is broken:
      authorized_keys is untouched and this host simply does not accept
      certificates yet.
  when: ssh_hardening_ca_public_key | length > 0
  tags:
    - config
    - ssh

# Reading it back is worth more here than anywhere else in the role. A drop-in
# that sshd never included leaves the host accepting passwords while every sign
# says otherwise — and unlike a missing CA, which merely fails to add a way in,
# this one fails to remove one.
- name: Assert sshd no longer accepts passwords
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in _ssh_hardening_sshd_effective.stdout"
      - "'kbdinteractiveauthentication no' in _ssh_hardening_sshd_effective.stdout"
      # Compared against how sshd RENDERS the setting, not against how it was
      # written — see vars/main.yml. The two differ for prohibit-password on
      # every OpenSSH the fleet runs.
      - >-
        (_ssh_hardening_sshd_effective.stdout_lines
         | select('match', '^permitrootlogin ')
         | map('regex_replace', '^permitrootlogin ', '')
         | first | default(''))
        in _ssh_hardening_root_login_rendered[ssh_hardening_permit_root_login]
    fail_msg: >-
      sshd merged its configuration as
      [{{ _ssh_hardening_sshd_effective.stdout_lines
          | select('match', '^(passwordauthentication|kbdinteractiveauthentication|permitrootlogin) ')
          | join('; ') }}],
      but this run asked for passwords off and PermitRootLogin
      {{ ssh_hardening_permit_root_login }}. The drop-in at
      /etc/ssh/sshd_config.d/30-ansible-auth.conf is being ignored, or an
      earlier one overrides it — sshd takes the FIRST value it sees for these
      keywords, so check /etc/ssh/sshd_config for a setting above its Include
      line and for drop-ins sorting before 30-. Nothing is locked out; the host
      is as reachable as it was before this ran.
  when: ssh_hardening_disable_password_auth | bool
  tags:
    - config
    - ssh

# The same "green but broken" guard, for the piece whose failure is quietest of
# the three. A missing CA fails to add a login; a missing lockdown fails to
# remove one; a missing host certificate simply leaves clients doing what they
# already did — comparing fingerprints — and nobody notices until a rebuild
# produces the banner this was meant to end.
#
# `sshd -T` renders the directive as a lowercased keyword and the path as given:
# dump_cfg_strarray(sHostCertificate, ...) in OpenSSH's servconf.c, unchanged
# between the versions on Debian 12 and 13.
- name: Assert sshd is presenting its certificate
  ansible.builtin.assert:
    that:
      - ('hostcertificate ' ~ ssh_hardening_host_cert_path) in _ssh_hardening_sshd_effective.stdout
    fail_msg: >-
      sshd merged its configuration without hostcertificate
      {{ ssh_hardening_host_cert_path }}, so clients still verify this host by
      remembered fingerprint. Check that /etc/ssh/sshd_config carries its
      Include line and that the certificate file exists — sshd ignores a
      HostCertificate it cannot read, and says so only in its own log.
  when: ssh_hardening_host_cert | bool
  tags:
    - config
    - ssh

- name: Report the host certificate
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} presents a host certificate for
      {{ ssh_hardening_host_principals | join(', ') }}
      {{ '(issued this run)' if (_ssh_hardening_host_cert_needed | default(false) | bool)
         else '(' ~ (_ssh_hardening_host_cert_left.stdout | default('?') | trim) ~ ' days left)' }}.
      Clients need one @cert-authority line in known_hosts to benefit; without
      it nothing changes for them.
  when: ssh_hardening_host_cert | bool
  tags:
    - debug
    - config
