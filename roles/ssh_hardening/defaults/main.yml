---
# Additional sshd port for key-based automation over the NetBird mesh.
# Mesh :22 belongs to NB-SSH (the dashboard's in-browser break-glass SSH) on
# peers that enable it, so Ansible gets its own door; the ufw role opens this
# port on the mesh interface only (ufw_mesh_tcp). Issue #30, step 1.
# Sourced from the shared automation_ssh_port (group_vars/all) so the listener
# and the firewall rule can never drift apart.
ssh_hardening_mesh_port: "{{ automation_ssh_port | default(2200) }}"

# The host's canonical public sshd port, kept explicitly in the drop-in (the
# first Port directive replaces the implicit default 22). Override on hosts
# that deliberately run sshd on a non-standard port.
ssh_hardening_public_port: 22

# The fleet SSH certificate authority's public key, as published at
# infra/ssh_ca in OpenBao. EMPTY BY DEFAULT, and that default is the safety
# property: a run that was not handed the key leaves sshd exactly as it was
# rather than installing a trust anchor it cannot name. playbooks/ssh-ca-trust.yml
# is what fills it in.
ssh_hardening_ca_public_key: ""

# Where that key lands. Read by sshd as root at authentication time, so it is
# world-readable by convention and holds nothing secret — a CA public key is
# published on purpose.
ssh_hardening_ca_path: /etc/ssh/trusted-user-ca.pub

# Retire password authentication and password-based root login. OFF BY DEFAULT
# and that is not timidity: this is the one setting in the role that can end
# with nobody able to reach the host. Turn it on per host during a rollout, then
# flip this default once the fleet is through.
ssh_hardening_disable_password_auth: false

# What root is allowed to do once passwords are gone. `prohibit-password` keeps
# root reachable BY KEY — the provider's admin key, which is the break-glass
# that depends on neither OpenBao nor NetBird. `no` closes that door too and
# should only follow a deliberate decision about what replaces it.
ssh_hardening_permit_root_login: prohibit-password

# --- Host certificates -------------------------------------------------------
# The node proving it is itself, so a client verifies a signature instead of
# remembering a fingerprint. Without this, every rebuild produces the
# "REMOTE HOST IDENTIFICATION HAS CHANGED" banner on every machine that ever
# connected — and that banner is what teaches people to type yes without
# reading it.
#
# Requires an OpenBao token, because the certificate is signed by the CA and a
# node cannot reach OpenBao. The signing request is delegated to the controller.
ssh_hardening_openbao_token: ""
ssh_hardening_openbao_addr: "{{ openbao_addr | default('') }}"
ssh_hardening_openbao_ssh_mount: ssh
ssh_hardening_openbao_host_role: hosts

# The names this host answers to. Derived rather than listed, because the
# derivation is the same for every node and a hand-written list drifts.
# openbao-ssh-ca.yml decides which domains may appear at all; this decides which
# of them THIS host claims.
ssh_hardening_host_domains: []
ssh_hardening_host_principals: >-
  {{ ssh_hardening_host_domains
     | map('regex_replace', '^', inventory_hostname ~ '.') | list }}

# ed25519 because it is what every current Debian sshd generates and what
# clients negotiate; the certificate is bound to one key, so this names which.
ssh_hardening_host_key: /etc/ssh/ssh_host_ed25519_key.pub
ssh_hardening_host_cert_path: /etc/ssh/ssh_host_ed25519_key-cert.pub

# Re-sign once fewer than this many days remain. Wide, because nothing schedules
# a renewal run yet: the certificate is refreshed when the role happens to run.
ssh_hardening_host_cert_renew_days: 30

# On when there is a token to sign with and a name to sign for. Both halves
# come from the playbook, so a role run that was not given them leaves host
# identity exactly as it found it.
ssh_hardening_host_cert: >-
  {{ (ssh_hardening_openbao_token | length > 0)
     and (ssh_hardening_host_principals | length > 0) }}
