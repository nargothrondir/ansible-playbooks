---
# The x86-64 microarchitecture levels, taken from XanMod's own
# check_x86-64_psabi.sh (read 2026-09-13). Each level is the previous one PLUS
# the flags it adds, which is how the script builds them too:
#
#   if (level == 1 && /cx16/&&/lahf/&&...) level = 2
#
# Cumulative on purpose, and not merely for readability: it makes the levels
# monotonic, so a simple walk from 1 upwards cannot award level 3 to a CPU that
# failed level 2.
#
# The script matches with awk regexes, so its /lahf/ also matches lahf_lm --
# which is what Linux actually calls that flag. Comparing whole tokens, as this
# does, means spelling it in full: a literal 'lahf' would fail level 2 on every
# CPU in existence.
_xanmod_psabi_v1:
  - lm
  - cmov
  - cx8
  - fpu
  - fxsr
  - mmx
  - syscall
  - sse2

_xanmod_psabi_v2: "{{ _xanmod_psabi_v1 + ['cx16', 'lahf_lm', 'popcnt', 'sse4_1', 'sse4_2', 'ssse3'] }}"

_xanmod_psabi_v3: >-
  {{ _xanmod_psabi_v2 + ['avx', 'avx2', 'bmi1', 'bmi2', 'f16c', 'fma', 'abm',
                         'movbe', 'xsave'] }}

_xanmod_psabi_v4: >-
  {{ _xanmod_psabi_v3 + ['avx512f', 'avx512bw', 'avx512cd', 'avx512dq',
                         'avx512vl'] }}

# Walked in key order by the detection task.
_xanmod_psabi_levels:
  1: "{{ _xanmod_psabi_v1 }}"
  2: "{{ _xanmod_psabi_v2 }}"
  3: "{{ _xanmod_psabi_v3 }}"
  4: "{{ _xanmod_psabi_v4 }}"

# Overwritten by the detection walk (set_fact outranks role vars). Zero means
# nothing was detected -- an unparsable /proc/cpuinfo, or a machine that is not
# x86-64 at all -- and the assert treats it as a refusal to guess.
_xanmod_cpu_level: 0
